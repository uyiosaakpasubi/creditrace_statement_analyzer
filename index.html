<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrediTrace — Credit Turnover Workbench v001</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Fraunces:opsz,wght@9..144,340;9..144,420;9..144,560&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#F7F6F2;--surface:#FFFFFF;--sidebar:#EFEDE7;--border:#E4E2D8;
  --border-soft:rgba(228,226,216,.55);--hover:rgba(0,0,0,.05);
  --text:#1A1916;--muted:#6A6960;--dim:#ABA99F;
  --accent:#2A5C45;--accent-h:#1E4433;--accent-light:#EAF3EE;--accent-pale:#F4FAF7;
  --on-accent:#FFFFFF;
  --green:#1B7A4A;--green-bg:#EDF7F2;--green-bd:rgba(27,122,74,.22);
  --red:#B5341C;--red-bg:#FDECEA;--red-bd:rgba(181,52,28,.22);
  --amber:#B87A1A;--amber-bg:#FDF5E6;--amber-bd:rgba(184,122,26,.25);
  --navy:#1F3864;
  --chart-dr:#E2B8B0;
  --shadow-card:0 1px 2px rgba(26,25,22,.04),0 4px 14px rgba(26,25,22,.03);
  --badge-grad:linear-gradient(135deg,#1a3a2a,#2A5C45);--badge-fg:#7FCCA0;
  --sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --display:'Fraunces',Georgia,serif;
  --cat-salary-c:#2A5C45;--cat-salary-bg:#EAF3EE;
  --cat-interest-c:#1E7B6A;--cat-interest-bg:#E8F5F2;
  --cat-refund-c:#4A8A5C;--cat-refund-bg:#EDF4EE;
  --cat-transfer-c:#2E5F94;--cat-transfer-bg:#EEF3FA;
  --cat-fee-c:#8A6430;--cat-fee-bg:#F5EFE0;
  --cat-levy-c:#7A5225;--cat-levy-bg:#F5EDE0;
  --cat-tax-c:#6B4520;--cat-tax-bg:#F2EAD8;
  --cat-util-c:#6B4A9A;--cat-util-bg:#F0EDF7;
  --cat-airtime-c:#C47A1E;--cat-airtime-bg:#FDF5E8;
  --cat-food-c:#B5341C;--cat-food-bg:#FDECEA;
  --cat-transport-c:#1E7B8A;--cat-transport-bg:#EDF5F6;
  --cat-housing-c:#8A4A2A;--cat-housing-bg:#F5EDE8;
  --cat-shopping-c:#8A4A7A;--cat-shopping-bg:#F7EDF5;
  --cat-other-c:#5A6475;--cat-other-bg:#EEF0F3;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412;--surface:#181E1A;--sidebar:#141A16;--border:#28312B;
  --border-soft:rgba(60,72,64,.5);--hover:rgba(255,255,255,.05);
  --text:#E9E7DD;--muted:#A6ACA2;--dim:#6F776F;
  --accent:#5CB588;--accent-h:#74C79C;--accent-light:rgba(92,181,136,.13);--accent-pale:rgba(92,181,136,.06);
  --on-accent:#0E1511;
  --green:#54C08A;--green-bg:rgba(84,192,138,.12);--green-bd:rgba(84,192,138,.3);
  --red:#E07A66;--red-bg:rgba(224,122,102,.12);--red-bd:rgba(224,122,102,.3);
  --amber:#DBA14A;--amber-bg:rgba(219,161,74,.12);--amber-bd:rgba(219,161,74,.3);
  --navy:#8FAEDC;
  --chart-dr:#7A4A42;
  --shadow-card:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --badge-grad:linear-gradient(135deg,#1D3A2B,#2E5C45);--badge-fg:#8FD9B2;
  --cat-salary-c:#7BC9A0;--cat-salary-bg:rgba(123,201,160,.13);
  --cat-interest-c:#6FC4B4;--cat-interest-bg:rgba(111,196,180,.13);
  --cat-refund-c:#8CC69C;--cat-refund-bg:rgba(140,198,156,.13);
  --cat-transfer-c:#88AEDC;--cat-transfer-bg:rgba(136,174,220,.13);
  --cat-fee-c:#CDA96E;--cat-fee-bg:rgba(205,169,110,.13);
  --cat-levy-c:#C49A6A;--cat-levy-bg:rgba(196,154,106,.13);
  --cat-tax-c:#BE9564;--cat-tax-bg:rgba(190,149,100,.13);
  --cat-util-c:#B39BDB;--cat-util-bg:rgba(179,155,219,.13);
  --cat-airtime-c:#DFAE64;--cat-airtime-bg:rgba(223,174,100,.13);
  --cat-food-c:#E08A78;--cat-food-bg:rgba(224,138,120,.13);
  --cat-transport-c:#72BECB;--cat-transport-bg:rgba(114,190,203,.13);
  --cat-housing-c:#CC8E6C;--cat-housing-bg:rgba(204,142,108,.13);
  --cat-shopping-c:#CE93BE;--cat-shopping-bg:rgba(206,147,190,.13);
  --cat-other-c:#9AA4B2;--cat-other-bg:rgba(154,164,178,.13);
}
html.theme-anim, html.theme-anim *{transition:background-color .28s ease,border-color .28s ease,color .28s ease !important}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── Layout ─────────────────────────────── */
.layout{display:flex;min-height:100vh}
.sidebar{width:210px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0 18px;position:fixed;top:0;left:0;bottom:0;z-index:10}
.main-area{margin-left:210px;flex:1;padding:48px 52px;max-width:1060px}

/* ── Sidebar ────────────────────────────── */
.s-logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:18px}
.s-logo-name{font-family:var(--display);font-size:17px;font-weight:560;letter-spacing:.1px}
.s-logo-name em{color:var(--accent);font-style:normal}
.s-logo-sub{font-size:10px;color:var(--dim);letter-spacing:1.1px;text-transform:uppercase;margin-top:2px}
.s-nav{flex:1;padding:0 10px}
.s-nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;margin-bottom:2px;user-select:none}
.s-nav-item:hover{background:var(--hover);color:var(--text)}
.s-nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.s-nav-item svg{flex-shrink:0;opacity:.65}
.s-nav-item.active svg{opacity:1}
.s-upload-btn{margin:12px 10px 14px;padding:9px 12px;border-radius:7px;border:1px dashed var(--border);background:none;cursor:pointer;font-size:12px;color:var(--muted);font-family:var(--sans);text-align:left;transition:all .15s;width:calc(100% - 20px)}
.s-upload-btn:hover{border-color:var(--accent);color:var(--accent)}
.s-footer{padding:0 20px;font-size:10px;color:var(--dim);letter-spacing:.3px}

/* ── Page typography ────────────────────── */
.pg-eyebrow{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.pg-title{font-family:var(--display);font-size:31px;font-weight:340;color:var(--text);line-height:1.18;letter-spacing:-.2px;margin-bottom:6px}
.pg-sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.65}
.sec-label{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* ── Cards ──────────────────────────────── */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow-card)}
.card-lbl{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.card-val{font-family:var(--mono);font-size:20px;font-weight:500;line-height:1;color:var(--text)}
.card-val.g{color:var(--green)} .card-val.r{color:var(--red)}
.card-sub{font-size:11px;color:var(--dim);margin-top:5px}

/* ── Section box ────────────────────────── */
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow-card)}
.sbox-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sbox-title{font-size:12px;font-weight:500}
.sbox-meta{font-size:11px;color:var(--dim);font-family:var(--mono)}

/* ── Account bar ────────────────────────── */
.acct-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:17px 22px;box-shadow:var(--shadow-card);display:flex;gap:30px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.af{display:flex;flex-direction:column;gap:2px}
.fl{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
.fv{font-size:13px;font-weight:500}
.fv.mono{font-family:var(--mono)}
.fv.ac{color:var(--accent)}

/* ── Chart ──────────────────────────────── */
.chart-wrap{padding:18px 18px 10px;overflow:hidden}
.chart-legend{display:flex;gap:16px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── Category bars ──────────────────────── */
.cat-list{padding:14px 18px}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-row:last-child{margin-bottom:0}
.cat-name{font-size:12px;color:var(--muted);width:85px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.cat-fill{height:100%;border-radius:2px}
.cat-amt{font-family:var(--mono);font-size:11px;color:var(--muted);width:80px;text-align:right;flex-shrink:0}

/* ── Transaction list ───────────────────── */
.txn-date-hdr{font-size:11px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.6px;padding:11px 18px 7px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.txn-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border-soft);transition:background .1s;cursor:default}
.txn-row:hover{background:var(--bg)}
.txn-row:last-child{border-bottom:none}
.txn-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;font-family:var(--mono)}
.txn-body{flex:1;min-width:0}
.txn-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:11px;color:var(--dim);margin-top:1px}
.txn-right{text-align:right;flex-shrink:0}
.txn-amount{font-family:var(--mono);font-size:13px;font-weight:500}
.txn-amount.cr{color:var(--green)} .txn-amount.dr{color:var(--red)}
.txn-cat{font-size:10px;color:var(--dim);margin-top:2px;font-family:var(--mono)}

/* ── Theme toggle ───────────────────────── */
.theme-toggle{margin:0 10px 12px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:var(--sans);font-size:11px;color:var(--muted);transition:border-color .15s,color .15s;width:calc(100% - 20px)}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{flex-shrink:0}
.theme-toggle .tt-track{margin-left:auto;width:28px;height:15px;border-radius:9px;background:var(--border);position:relative;transition:background .2s}
.theme-toggle .tt-knob{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
[data-theme="dark"] .theme-toggle .tt-track{background:var(--accent)}
[data-theme="dark"] .theme-toggle .tt-knob{transform:translateX(13px)}
:where(button,input,.s-nav-item):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:7px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ── Responsive ─────────────────────────── */
@media (max-width: 920px){
  .sidebar{position:static;width:100%;height:auto;flex-direction:row;align-items:center;padding:10px 14px;border-right:none;border-bottom:1px solid var(--border);gap:6px;overflow-x:auto}
  .s-logo{padding:0 12px 0 0;border-bottom:none;margin-bottom:0;flex-shrink:0}
  .s-logo-sub{display:none}
  .s-nav{display:flex;padding:0;gap:2px}
  .s-nav-item{margin-bottom:0;white-space:nowrap;padding:7px 10px}
  .s-upload-btn{margin:0;width:auto;white-space:nowrap;flex-shrink:0}
  .s-footer{display:none}
  .theme-toggle{margin:0;width:auto;flex-shrink:0}
  .theme-toggle .tt-label{display:none}
  .layout{flex-direction:column}
  .main-area{margin-left:0;padding:22px 16px;max-width:none}
  .cards3{grid-template-columns:1fr}
  .acct-bar{gap:16px}
  .grid2{grid-template-columns:1fr !important}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ── Filter bar ─────────────────────────── */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.fbtn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--sans);transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ── View toggle ────────────────────────── */
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
.vtbtn{padding:6px 16px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--surface);border:none;font-family:var(--sans);transition:all .15s}
.vtbtn.active{background:var(--accent);color:var(--on-accent)}
.vtbtn:first-child{border-right:1px solid var(--border)}

/* ── Search ─────────────────────────────── */
.search-wrap{position:relative;margin-bottom:18px}
.search-wrap input{width:100%;padding:8px 14px 8px 34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;font-family:var(--sans);color:var(--text);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--dim)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}

/* ── Monthly table ──────────────────────── */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--sidebar);padding:9px 13px;text-align:right;font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);font-weight:400;white-space:nowrap}
th:first-child{text-align:left}
td{padding:9px 13px;text-align:right;font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--border-soft);color:var(--muted);white-space:nowrap;vertical-align:middle}
td:first-child{text-align:left;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text)}
tbody tr:hover{background:var(--bg)}
tbody tr.part td:first-child{color:var(--dim);font-style:italic}
tfoot td{background:var(--sidebar);font-weight:600;color:var(--text);border-top:1px solid var(--border);border-bottom:none}
tfoot td:first-child{font-family:var(--sans);font-size:13px}
.cr{color:var(--green)} .dr{color:var(--red)}
.np{color:var(--green);font-weight:500} .nn{color:var(--red);font-weight:500} .nz{color:var(--dim)}
.cnt{color:var(--dim);font-size:11px}

/* ── Integrity checks ───────────────────── */
.checks-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.chk{padding:12px 14px;border-radius:8px;border:1px solid var(--border)}
.chk.pass{border-color:var(--green-bd);background:var(--green-bg)}
.chk.fail{border-color:var(--red-bd);background:var(--red-bg)}
.chk-status{display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.chk-status.pass{color:var(--green)} .chk-status.fail{color:var(--red)}
.chk-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.chk-name{font-size:12px;font-weight:500;margin-bottom:2px}
.chk-note{font-size:11px;color:var(--muted)}

/* ── Insights ───────────────────────────── */
.metrics3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.metric-lbl{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.metric-val{font-family:var(--mono);font-size:18px;font-weight:500;line-height:1}
.metric-sub{font-size:11px;color:var(--dim);margin-top:4px}
.counterparty-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border-soft)}
.counterparty-row:last-child{border-bottom:none}
.cp-name{flex:1;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-count{font-size:11px;color:var(--dim);margin-right:8px;font-family:var(--mono)}
.cp-amt{font-family:var(--mono);font-size:13px;color:var(--red);font-weight:500}
.recurring-row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border-soft)}
.recurring-row:last-child{border-bottom:none}
.rr-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.rr-name{flex:1;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-meta{font-size:11px;color:var(--dim);font-family:var(--mono)}
.quote-block{padding:20px 18px;border-left:2px solid var(--accent-light);margin:20px 0}
.quote-text{font-size:14px;color:var(--muted);font-style:italic;line-height:1.75;margin-bottom:6px}
.quote-attr{font-size:11px;color:var(--dim);font-family:var(--mono)}

/* ── Upload page ────────────────────────── */
.upload-page{max-width:500px;margin:0 auto;padding-top:20px}
.drop-zone{border:2px dashed var(--border);border-radius:16px;padding:52px 36px;text-align:center;cursor:pointer;background:var(--surface);transition:all .2s;position:relative;overflow:hidden;margin-bottom:20px}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:var(--accent-pale)}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-icon{color:var(--accent);opacity:.55;margin:0 auto 16px;display:block}
.drop-title{font-size:15px;font-weight:500;margin-bottom:6px}
.drop-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.bank-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.btag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--dim);letter-spacing:.3px}
.privacy-note{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.privacy-note svg{flex-shrink:0;margin-top:1px;color:var(--accent)}
.privacy-note p{font-size:12px;color:var(--muted);line-height:1.6}
.err-box{background:var(--red-bg);border:1px solid var(--red-bd);border-radius:8px;padding:11px 15px;color:var(--red);font-size:12px;display:none;line-height:1.6;margin-top:12px}
.err-box.vis{display:block}

/* ── Progress ───────────────────────────── */
.prog-page{max-width:400px;margin:80px auto;text-align:center}
.prog-spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-lbl{font-size:13px;color:var(--muted);margin-bottom:18px}
.prog-track{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .35s ease;width:0}

/* ── Buttons ────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;font-family:var(--sans);cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p:hover{background:var(--accent-h);transform:translateY(-1px)}
.btn-s{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.btn-g{background:transparent;color:var(--muted);border:1px dashed var(--border)}
.btn-g:hover{color:var(--text);border-color:var(--border)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ── Responsive ─────────────────────────── */
@media(max-width:780px){
  .sidebar{display:none}
  .main-area{margin-left:0;padding:24px 18px}
  .cards3,.metrics3{grid-template-columns:1fr}
}
@media print{
  .sidebar,.btn-row,.filter-bar,.view-toggle,.search-wrap{display:none!important}
  .main-area{margin-left:0;padding:16px}
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── Credit Profile ─────────────────────── */
.risk-banner{border-radius:12px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.risk-banner.low{background:var(--green-bg);border:1px solid var(--green-bd)}
.risk-banner.medium{background:var(--amber-bg);border:1px solid var(--amber-bd)}
.risk-banner.high{background:var(--red-bg);border:1px solid var(--red-bd)}
.risk-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.risk-icon.low{background:var(--green-bg)}
.risk-icon.medium{background:var(--amber-bg)}
.risk-icon.high{background:var(--red-bg)}
.risk-text h3{font-size:15px;font-weight:600;margin-bottom:2px}
.risk-text h3.low{color:var(--green)}.risk-text h3.medium{color:var(--amber)}.risk-text h3.high{color:var(--red)}
.risk-text p{font-size:12px;color:var(--muted);line-height:1.55}
.flag-row{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-soft)}
.flag-row:last-child{border-bottom:none}
.flag-sev{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.flag-sev.critical{background:var(--red)}.flag-sev.warning{background:var(--amber)}.flag-sev.info{background:var(--accent)}
.flag-body{flex:1;min-width:0}
.flag-title{font-size:13px;font-weight:500;margin-bottom:2px}
.flag-note{font-size:11px;color:var(--muted);line-height:1.5}
.flag-amount{font-family:var(--mono);font-size:13px;font-weight:500;text-align:right;flex-shrink:0}
.flag-amount.r{color:var(--red)}.flag-amount.a{color:var(--amber)}.flag-amount.g{color:var(--green)}
.beh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.beh-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.beh-card.flagged{border-color:var(--red-bd);background:var(--red-bg)}
.beh-card.caution{border-color:var(--amber-bd);background:var(--amber-bg)}
.beh-card.good{border-color:var(--green-bd);background:var(--green-bg)}
.beh-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.beh-label{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
.beh-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--mono);font-weight:500}
.beh-badge.flagged{background:var(--red-bg);color:var(--red)}.beh-badge.caution{background:var(--amber-bg);color:var(--amber)}.beh-badge.good{background:var(--green-bg);color:var(--green)}
.beh-val{font-family:var(--mono);font-size:18px;font-weight:500;margin-bottom:3px}
.beh-sub{font-size:11px;color:var(--muted)}
.txn-flag-row{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border-soft)}
.txn-flag-row:last-child{border-bottom:none}
.tfr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tfr-narr{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tfr-date{font-size:11px;color:var(--dim);font-family:var(--mono);flex-shrink:0;margin-right:6px}
.tfr-amt{font-family:var(--mono);font-size:12px;font-weight:500;flex-shrink:0}
.stability-row{display:flex;align-items:center;gap:8px;padding:8px 18px}
.stab-month{font-family:var(--mono);font-size:11px;color:var(--dim);width:60px;flex-shrink:0}
.stab-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.stab-fill{height:100%;border-radius:3px}
.stab-amt{font-family:var(--mono);font-size:11px;width:90px;text-align:right;flex-shrink:0}
.stab-status{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Monthly table ──────────────────────────────────────── */
.mt{width:100%;border-collapse:collapse;font-size:12px}
.mt thead tr{border-bottom:1.5px solid var(--border)}
.mt thead th{padding:6px 10px;font-weight:500;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.mt tbody tr{border-bottom:.5px solid var(--border-soft)}
.mt tbody tr:last-child{border-bottom:none}
.mt tbody tr:hover{background:var(--surface)}
.mt tfoot tr{border-top:1.5px solid var(--border);background:var(--surface)}
.mt tfoot td{padding:7px 10px}
.mt td,.mt th{padding:5px 10px;white-space:nowrap}
.mt-lbl{text-align:left;font-weight:500;color:var(--text)}
.mt-num{text-align:right;font-variant-numeric:tabular-nums}
.mt-cnt{text-align:right;color:var(--dim);font-size:11px}
.partial-tag{font-size:9px;color:var(--dim);margin-left:2px;vertical-align:super}

/* ── AI / API key UI ────────────────────────────── */
.ai-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:var(--badge-grad);color:var(--badge-fg);font-size:10px;font-family:var(--mono);font-weight:500;letter-spacing:.5px;vertical-align:middle;margin-left:8px}
.ai-badge svg{opacity:.8}
.key-wrap{margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.key-label{font-size:10px;font-family:var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.key-label-star{color:var(--accent);font-size:12px}
.key-input-row{display:flex;gap:8px;align-items:center}
.key-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg);font-family:var(--mono);font-size:12px;color:var(--text);outline:none;transition:border-color .15s;letter-spacing:.5px}
.key-input:focus{border-color:var(--accent)}
.key-toggle{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:11px;color:var(--muted);font-family:var(--sans);transition:all .15s;white-space:nowrap}
.key-toggle:hover{border-color:var(--accent);color:var(--accent)}
.key-hint{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.55}
.key-status{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;margin-top:5px}
.key-status.set{background:var(--green-bg);color:var(--green)}
.key-status.unset{background:var(--amber-bg);color:var(--amber)}
.claude-prog{margin-top:8px;font-size:11px;color:var(--accent);font-family:var(--mono);text-align:center;min-height:16px}
/* ── CrediTrace: multi-statement case page ─────────────────────── */
.ct-page{max-width:920px;margin:0 auto;padding-top:20px}
.ct-drop{border:2px dashed var(--border);border-radius:16px;padding:34px 28px;text-align:center;cursor:pointer;background:var(--surface);transition:all .2s;position:relative;overflow:hidden;margin-bottom:20px}
.ct-drop:hover,.ct-drop.over{border-color:var(--accent);background:var(--accent-pale)}
.ct-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ct-drop-icon{color:var(--dim);margin-bottom:10px}
.ct-drop-title{font-size:14px;color:var(--text);margin-bottom:4px}
.ct-drop-sub{font-size:12px;color:var(--muted)}
.ct-meta-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ct-field{flex:1;min-width:220px}
.ct-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-family:var(--mono)}
.ct-field input[type=date]{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit}
.ct-stmt-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.ct-stmt-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface);display:flex;align-items:center;gap:14px}
.ct-stmt-card.ct-quarantined{border-color:var(--red-bd);background:var(--red-bg)}
.ct-stmt-radio{flex-shrink:0;width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.ct-stmt-radio:disabled{cursor:not-allowed;opacity:.4}
.ct-stmt-body{flex:1;min-width:0}
.ct-stmt-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.ct-stmt-bank{font-size:13.5px;font-weight:560;color:var(--text)}
.ct-stmt-app-tag{font-size:10px;font-family:var(--mono);color:var(--accent);background:var(--accent-light);border-radius:5px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
.ct-stmt-meta{font-size:12px;color:var(--muted);line-height:1.5}
.ct-badge{font-size:10.5px;font-family:var(--mono);border-radius:6px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
.ct-badge.ok{background:var(--green-bg);color:var(--green)}
.ct-badge.fail{background:var(--red-bg);color:var(--red)}
.ct-badge.pending{background:var(--amber-bg);color:var(--amber)}
.ct-stmt-remove{flex-shrink:0;background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px;transition:all .15s}
.ct-stmt-remove:hover{color:var(--red);background:var(--red-bg)}
.ct-dedup-card{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--accent-pale);margin-bottom:22px}
.ct-dedup-title{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
.ct-dedup-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--text)}
.ct-dedup-row b{color:var(--accent)}
.ct-empty-note{font-size:13px;color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--border);border-radius:12px}
.ct-processing{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);padding:12px 0}
/* ── CrediTrace: analysis page (Checkpoint 3) ───────────────────── */
.ct-ladder{border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:22px;overflow:hidden}
.ct-ladder-row{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border-soft)}
.ct-ladder-row:last-child{border-bottom:none}
.ct-ladder-row.ct-ladder-sub{padding-left:32px;color:var(--muted);font-size:13px}
.ct-ladder-row.ct-ladder-final{background:var(--accent-pale);font-weight:560}
.ct-ladder-row.ct-ladder-floor{background:var(--accent-light);font-weight:620}
.ct-ladder-label{font-size:13.5px;color:var(--text)}
.ct-ladder-value{font-family:var(--mono);font-size:14px;color:var(--text)}
.ct-ratio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.ct-ratio-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface)}
.ct-ratio-card .ct-ratio-big{font-family:var(--mono);font-size:24px;color:var(--accent);margin-bottom:2px}
.ct-ratio-card .ct-ratio-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ct-section-title{font-size:14px;font-weight:560;color:var(--text);margin:26px 0 10px}
.ct-flag-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ct-flag-row{border:1px solid var(--border);border-radius:10px;padding:11px 14px;background:var(--surface);font-size:13px}
.ct-flag-row .ct-flag-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.ct-flag-row .ct-flag-amt{font-family:var(--mono);color:var(--text);font-weight:560}
.ct-flag-row .ct-flag-why{color:var(--muted);font-size:12.5px;line-height:1.5}
.ct-tier-tag{font-size:10px;font-family:var(--mono);border-radius:5px;padding:2px 7px;text-transform:uppercase}
.ct-tier-tag.high{background:var(--red-bg);color:var(--red)}
.ct-tier-tag.probable{background:var(--amber-bg);color:var(--amber)}
.ct-tier-tag.confirmed{background:var(--green-bg);color:var(--green)}
.ct-appdate-note{font-size:12.5px;color:var(--muted);margin-bottom:14px}
/* ── CrediTrace: workbench page (Checkpoint 4) ──────────────────── */
.ct-wb-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--accent-pale)}
.ct-wb-summary-item .ct-wb-val{font-family:var(--mono);font-size:17px;color:var(--text)}
.ct-wb-summary-item .ct-wb-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ct-wb-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ct-wb-filter-btn{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit}
.ct-wb-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ct-wb-row{border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.ct-wb-row.ct-wb-dismissed{opacity:.55}
.ct-wb-row-head{padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.ct-wb-row-head:hover{background:var(--accent-pale)}
.ct-wb-row-kind{font-size:12.5px;color:var(--text);flex:1;min-width:0}
.ct-wb-row-kind b{font-weight:600}
.ct-wb-row-amt{font-family:var(--mono);font-size:13.5px;color:var(--text);white-space:nowrap}
.ct-wb-verdict-badge{font-size:10px;font-family:var(--mono);border-radius:5px;padding:2px 7px;text-transform:uppercase;white-space:nowrap}
.ct-wb-verdict-badge.upheld{background:var(--red-bg);color:var(--red)}
.ct-wb-verdict-badge.dismissed{background:var(--border-soft);color:var(--muted)}
.ct-wb-verdict-badge.pending{background:var(--amber-bg);color:var(--amber)}
.ct-wb-row-body{padding:0 16px 16px;border-top:1px solid var(--border-soft)}
.ct-wb-legs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.ct-wb-leg{border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;font-size:12px}
.ct-wb-leg-hdr{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px}
.ct-wb-leg-narr{color:var(--text);line-height:1.5;word-break:break-word}
.ct-wb-why{font-size:12.5px;color:var(--muted);line-height:1.55;margin:10px 0}
.ct-wb-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ct-wb-btn{font-size:12px;padding:6px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;color:var(--text)}
.ct-wb-btn.uphold.active{background:var(--red);color:#fff;border-color:var(--red)}
.ct-wb-btn.dismiss.active{background:var(--dim);color:#fff;border-color:var(--dim)}
.ct-wb-note{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit;resize:vertical;min-height:44px}
.ct-wb-note::placeholder{color:var(--dim)}
</style>
</head>

<script>
/* ================================================================
   BANKLENS v2.4 — Nigerian Bank Statement Analyzer
   Supports: OPay · AltBank · Stanbic IBTC · GTBank ·
             Access Bank · Kuda · ProvidusBank · Union Bank
   ================================================================ */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Constants ───────────────────────────────────────────────────
const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11,
  JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};

const FNAMES = {opay:'OPay Wallet',altbank:'Alternative Bank',stanbic:'Stanbic IBTC',
  gtbank:'GTBank',access:'Access Bank',accessdba:'Access Bank (DBA Premium)',accessweb:'Access Bank (Web Export)',kuda:'Kuda Bank',

// ── PDF Extraction ───────────────────────────────────────────────
async function extractText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pageTexts = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    setProg(`Extracting page ${p} / ${pdf.numPages}…`, Math.round(5 + (p / pdf.numPages) * 30));
    const page    = await pdf.getPage(p);
    const content = await page.getTextContent();
    page.cleanup();
    // Y-tolerance bucketing: group items within ±2px of an existing row
    const yBuckets = {};
    for (const item of content.items) {
      if (!item.str) continue;
      const y = item.transform[5];
      const existing = Object.keys(yBuckets).find(k => Math.abs(Number(k) - y) <= 2);
      const key = existing !== undefined ? existing : String(y);
      if (!yBuckets[key]) yBuckets[key] = [];
      yBuckets[key].push({ x: item.transform[4], s: item.str });
    }
    const lines = Object.entries(yBuckets)
      .sort(([ya],[yb]) => Number(yb) - Number(ya))
      .map(([,items]) => items.sort((a,b) => a.x - b.x).map(i => i.s).join(''));
    pageTexts.push(lines.join('\n'));
  }
  return { fullText: pageTexts.join('\n'), pages: pageTexts };
}

// ── Stream-order extraction (for ALAT: preserves column order) ──
async function extractTextStreamOrder(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page    = await pdf.getPage(p);
    const content = await page.getTextContent();
    page.cleanup();
    // Items in content stream order — no coordinate re-sorting
    // This preserves Credit/Debit/Balance column adjacency
    const text = content.items
      .filter(item => item.str && item.str.trim() && item.str.length <= 100)
      .map(item => item.str)
      .join(' ');
    pages.push(text);
  }
  return pages.join('\n');
}

// ── Claude AI Extraction ─────────────────────────────────────────
// Parallel batching: all batches fire simultaneously (up to PARALLEL at a time).
// For a 179-page statement: 15 batches of 12 pages, 4 in parallel = ~3 rounds = ~20s.
// Sequential was ~45 calls × 8s = 6 minutes.
const CLAUDE_MODEL  = 'claude-sonnet-4-6';
const BATCH_SZ      = 8;     // smaller = fewer output tokens per call, no truncation risk
const PARALLEL      = 5;     // more concurrency compensates for smaller batches
const MAX_OUT_TOKS  = 8192;  // 8 pages × ~12 txns × ~60 tokens = ~5760 output tokens needed

function claudeSystemPrompt(fmt) {
  const base = `You are a bank statement transaction extractor.
Return ONLY a valid JSON array — no markdown, no explanation, no code fences.
Each element: {"date":"YYYY-MM-DD","narration":"string","debit":number,"credit":number,"balance":number}
Rules:
- date: ISO format YYYY-MM-DD
- narration: description only, max 80 chars, no amounts, no dates, no reference numbers
- debit: money leaving the account. 0 if none. Always a positive number or 0.
- credit: money entering the account. 0 if none. Always a positive number or 0.
- balance: running balance shown after this transaction.
- A single row CANNOT have both debit > 0 AND credit > 0.
- "--" means 0 for that column.
- SKIP: column headers, page numbers, opening/closing balance summary rows, totals rows.
- If a page has no transactions, return [].
- CRITICAL: Transaction amounts are FORMATTED CURRENCY VALUES with commas and two decimal places
  (e.g. "1,000.00", "38,500.00", "1,250,000.00"). Long digit strings WITHOUT decimal points
  (e.g. "09825121571934", "260514140300253294423638") are REFERENCE NUMBERS — NEVER treat
  them as amounts. If you are unsure whether a number is an amount or a reference, skip it.`;

  if (fmt === 'opay') return base + `

OPay wallet statement. Table columns in order:
Trans. Time | Value Date | Description | Debit(₦) | Credit(₦) | Balance After(₦) | Channel | Transaction Reference

Critical rules for OPay:
- The LAST column is "Transaction Reference" — a long integer like "260514140300253294423638".
  This is NEVER a currency amount. IGNORE IT COMPLETELY.
- Currency amounts ALWAYS contain a decimal point and exactly 2 decimal digits: e.g. "1,000.00".
- "--" in Debit or Credit column means that value is 0.
- Read Debit(₦) and Credit(₦) DIRECTLY from their respective columns.
- The wallet balance frequently returns to ₦0.00 — this is normal behaviour.
- Some lines have a reference number at the start before the date — skip that prefix entirely.
- Maximum plausible single-transaction amount on this wallet is ₦5,000,000. Any larger value
  you think you see is almost certainly a reference number parsed incorrectly — set it to 0.`;

  return base;
}

async function callClaudeBatch(content, system, apiKey) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: MAX_OUT_TOKS,
      system,
      messages: [{ role: 'user', content }],
    }),
  });

  if (!resp.ok) {
    let msg = resp.statusText;
    try { const j = await resp.json(); msg = j.error?.message || msg; } catch(_) {}
    if (resp.status === 401) throw new Error('Claude API key invalid or expired.');
    const err = new Error(`Claude API ${resp.status}: ${msg}`);
    // 429 and 5xx are transient — mark retryable so the caller backs off and retries
    if (resp.status === 429 || resp.status >= 500) err.retryable = true;
    throw err;
  }

  const data = await resp.json();
  const raw  = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');

  // Truncated output = incomplete JSON. Signal the caller to split the batch.
  if (data.stop_reason === 'max_tokens') {
    const err = new Error('Claude output truncated (max_tokens).');
    err.truncated = true;
    throw err;
  }

  // Balanced-bracket extraction: find the first top-level JSON array.
  // More robust than a greedy regex when the model emits stray brackets in prose.
  const start = raw.indexOf('[');
  if (start === -1) return [];
  let depth = 0, end = -1, inStr = false, escNext = false;
  for (let i = start; i < raw.length; i++) {
    const ch = raw[i];
    if (escNext) { escNext = false; continue; }
    if (ch === '\\') { escNext = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === '[') depth++;
    else if (ch === ']') { depth--; if (depth === 0) { end = i; break; } }
  }
  if (end === -1) return [];
  try {
    return JSON.parse(raw.slice(start, end + 1));
  } catch(e) {
    console.warn('[BankLens Claude] JSON parse failed:', e.message, raw.slice(0, 200));
    return [];
  }
}

// Resilient batch runner: retries transient failures with backoff, and on
// truncation recursively splits the page slice in half until output fits.
async function extractBatch(pagesSlice, startIdx, system, apiKey, depth = 0) {
  const content = pagesSlice
    .map((pg, i) => `=== PAGE ${startIdx + i + 1} ===\n${pg}`)
    .join('\n\n');
  try {
    return await callClaudeBatch(content, system, apiKey);
  } catch (e) {
    if (e.truncated && pagesSlice.length > 1 && depth < 4) {
      const mid = Math.ceil(pagesSlice.length / 2);
      const a = await extractBatch(pagesSlice.slice(0, mid), startIdx, system, apiKey, depth + 1);
      const b = await extractBatch(pagesSlice.slice(mid), startIdx + mid, system, apiKey, depth + 1);
      return [...a, ...b];
    }
    if (e.retryable && depth < 3) {
      await sleep(1500 * (depth + 1));
      return extractBatch(pagesSlice, startIdx, system, apiKey, depth + 1);
    }
    throw e;
  }
}

async function claudeExtract(pages, fmt) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error('No Claude API key set. Enter it on the upload page.');

  const system = claudeSystemPrompt(fmt);

  // Batches are kept as page-slice descriptors (not pre-joined strings) so a
  // truncated batch can be split and re-sent at page granularity.
  const batches = [];
  for (let i = 0; i < pages.length; i += BATCH_SZ) {
    batches.push({ slice: pages.slice(i, i + BATCH_SZ), startIdx: i });
  }

  const totalBatches = batches.length;
  setProg(`Claude reading ${pages.length} pages (${totalBatches} batches, ${PARALLEL} parallel)…`, 56);
  if ($('claudeProg')) $('claudeProg').textContent =
    `▸ ${totalBatches} batches · ${PARALLEL} simultaneous · est. ${Math.ceil(totalBatches / PARALLEL) * 10}s`;

  const allRows = [];
  let done = 0;

  // Process PARALLEL batches at a time. allSettled: one failed batch degrades
  // coverage instead of destroying the whole extraction.
  let failedBatches = 0;
  for (let i = 0; i < batches.length; i += PARALLEL) {
    const chunk = batches.slice(i, i + PARALLEL);
    const results = await Promise.allSettled(
      chunk.map(c => extractBatch(c.slice, c.startIdx, system, apiKey)));
    for (const r of results) {
      if (r.status === 'fulfilled') allRows.push(...r.value);
      else { failedBatches++; console.warn('[BankLens Claude] batch failed:', r.reason?.message); }
    }
    done += chunk.length;
    const pct = Math.round(57 + (done / totalBatches) * 35);
    setProg(`Claude: ${done}/${totalBatches} batches done…`, pct);
    if ($('claudeProg')) $('claudeProg').textContent =
      `▸ ${done}/${totalBatches} batches · ${allRows.length} transactions so far`;
    if (i + PARALLEL < batches.length) await sleep(150); // brief pause between rounds
  }
  if (failedBatches === batches.length) throw new Error('All Claude batches failed — check API key, credit balance, or network.');
  if (failedBatches > 0) console.warn(`[BankLens Claude] ${failedBatches}/${batches.length} batches failed — results are partial.`);

  // Map raw JSON rows → txn objects
  const txns = [];
  for (const row of allRows) {
    if (!row.date) continue;
    const date = new Date(row.date + 'T00:00:00Z');
    if (isNaN(date.getTime())) continue;
    let debit  = Math.max(0, parseFloat(row.debit)  || 0);
    let credit = Math.max(0, parseFloat(row.credit) || 0);
    const bal  = parseFloat(row.balance) || 0;

    // Sanity thresholds: reference numbers contaminating amounts produce values
    // in the billions. OPay: zero them (documented reference-contamination bug,
    // ₦5M wallet ceiling). All other formats: NEVER silently zero — corporate
    // statements legitimately carry very large tickets. Flag as suspect instead
    // so the analyst reviews rather than the tool destroying data.
    const maxTxn = fmt === 'opay' ? 5_000_000 : 500_000_000;
    let suspect = false;
    if (fmt === 'opay') {
      if (debit  > maxTxn) { console.warn('[BankLens] Dropping implausible OPay debit',  debit,  row); debit  = 0; }
      if (credit > maxTxn) { console.warn('[BankLens] Dropping implausible OPay credit', credit, row); credit = 0; }
    } else if (debit > maxTxn || credit > maxTxn) {
      suspect = true;
      console.warn('[BankLens] Flagging implausible amount for review', { debit, credit, row });
    }

    txns.push({
      date,
      debit,
      credit,
      balance:   bal,
      suspect,
      narration: (row.narration || '').slice(0, 80).trim(),
      cat:       categorise(row.narration || '', credit > 0),
    });
  }

  // Sort chronologically and deduplicate
  txns.sort((a, b) => a.date - b.date);
  const seen = new Set();
  return txns.filter(t => {
    const k = `${t.date.toISOString().slice(0,10)}|${t.debit.toFixed(2)}|${t.credit.toFixed(2)}|${t.balance.toFixed(2)}|${t.narration.slice(0,14)}`;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}


function cleanNarr(raw) {
  return (raw || '')
    .replace(/\d{2}\s+[A-Za-z]{3}\s+\d{4}(?:\s+\d{2}:\d{2}:\d{2})?/g,' ')
    .replace(/\d{2}[/-][A-Za-z]{3}[/-]\d{4}/g,' ')
    .replace(/\d{2}\/\d{2}\/\d{4}(?:\s+\d{2}:\d{2}:\d{2})?/g,' ')
    .replace(/\d{2}-\d{2}-\d{4}/g,' ')
    .replace(/\d{2}-[A-Z]{3}-\d{2}\b/g,' ')
    .replace(/[\d,]{4,}\.\d{2}/g,' ')
    .replace(/\b\d{10,}\b/g,' ')
    .replace(/\/\d{4,8}\//g,' ')
    .replace(/[|]/g,' ')
    .replace(/\s{2,}/g,' ')
    .trim()
    .slice(0, 75);
}

function avatarText(narration) {
  const words = (narration||'').replace(/[|\/\-]/g,' ').split(/\s+/)
    .filter(w => w.length > 2 && !/^\d+$/.test(w) &&
      !/^(NIP|TRF|VAT|CBN|FEE|THE|AND|FOR|TO|FROM|OF|BANK)$/i.test(w));
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return '??';
}

// ── Categoriser ──────────────────────────────────────────────────
function categorise(narration, isCredit) {
  const n = (narration||'').toUpperCase();
  if (isCredit) {
    if (/SALARY|PAYROLL|STIPEND|WAGE/.test(n))        return 'Salary';
    if (/INT\.?\s*PD|INTEREST\s*RUN|INTEREST/.test(n)) return 'Interest';
    if (/REFUND|REVERSAL|RETURN/.test(n))              return 'Refund';
    return 'Income';
  }
  if (/NIP-FEE|NIPFEE|NIP\s*FEE/.test(n))            return 'Bank Fee';
  if (/VAT-FEE|VAT\s*FEE|VAT\|VAT/.test(n))          return 'Bank Fee';
  if (/CBN\s*STAMP|STAMPDUTY|STAMP\s*DUTY/.test(n))   return 'Govt Levy';
  if (/CBN\s*ELECTR|ELECTRONICLEVY/.test(n))          return 'Govt Levy';
  if (/ALERT\s*CHARGE|SMS\s*ALERT/.test(n))           return 'Bank Fee';
  if (/CARD\s*MAINT|DEBIT\s*CARD/.test(n))            return 'Bank Fee';
  if (/WHT\s*COLL|WITHHOLDING/.test(n))               return 'Tax';
  if (/ELECTRICITY|NEPA|PHCN|IKEDC|EKEDC|AEDC|DSTV|GOTV|STARTIMES|NETFLIX|SHOWMAX/.test(n)) return 'Utilities';
  if (/AIRTIME|VTU|MTN|GLO|AIRTEL|9MOBILE|DATA\s*PLAN/.test(n)) return 'Airtime';
  if (/FOOD|RESTAURANT|EATERY|KITCHEN|BUKKA|CHICKEN|PIZZA|SUYA|CANTEEN/.test(n)) return 'Food';
  if (/UBER|BOLT|TAXI|FUEL|PETROL|FILLING|TRANSPORT|STATION/.test(n)) return 'Transport';
  if (/RENT|LANDLORD|APARTMENT|ESTATE|PROPERTY/.test(n)) return 'Housing';
  if (/SHOPPING|SUPERMARKET|MARKET|STORE|MALL/.test(n)) return 'Shopping';
  return 'Transfer';
}

// ── Format Detection ─────────────────────────────────────────────
function detectFormat(text) {
  const t = text.slice(0,6000);
  // Moniepoint: checked first and structurally, because Moniepoint narrations
  // routinely mention other banks as counterparties (e.g. "TRANSFER TO Omnipay-...
  // OPay"), which would otherwise false-positive against later bank-name rules.
  // The ISO-timestamp date-column format ("2025-07-01T09:55:56") is a genuine
  // structural property of Moniepoint's OWN statement layout and must gate
  // every signal below — not just the first. TRF|2MPT and MIT|HBP| are
  // Moniepoint's transfer-reference prefixes, but they leak into OTHER banks'
  // inbound-transfer narrations whenever the sender's account happens to be
  // Moniepoint-linked (e.g. an Access Bank DiamondXtra statement literally
  // quoting "AT129TRF|2MPT2c7i4|...HAMSIU JIBIY Trf for" from an incoming NIP
  // transfer). Without the ISO-timestamp gate, that single narration fragment
  // misroutes an entire non-Moniepoint statement into the Moniepoint parser.
  const ctHasIsoTimestamp = /\d{4}-\d{2}-\d{2}T\d{2}:/.test(t);
  if (ctHasIsoTimestamp && (/_BUSINESS_CREDIT_0|_DEBIT_0/.test(t) ||
      /TRF\|2MPT/i.test(t) || /MIT\|HBP\|/i.test(t))) return 'moniepoint';
  // Moniepoint "business/detailed" export — a much denser 18-column
  // template (Settlement Debit/Credit, Balance Before/After, Beneficiary/
  // Source Institution, etc.) than the simple 6-column consumer statement
  // above. Its date column is so narrow that the ISO timestamp fragments
  // across 3-4 separate text rows and never appears contiguously, so the
  // gate above can't fire — this needs its own anchor. "Settlement Debit"
  // + "Settlement Credit" + "Balance Before" + "Balance After" are this
  // template's own column headers, structurally safe from the same
  // counterparty-mention risk that affects bare bank-name text.
  // "Settlement Debit"/"Settlement Credit"/"Balance Before"/"Balance After"
  // are two-line column headers in the source PDF ("Settlement" / "Debit"
  // stacked). Row-based text extraction buckets by y-position, so each
  // header's first line and second line land on two DIFFERENT rows,
  // squished together with every other column's matching line —
  // "...SettlementSettlementBalanceBalance..." on one row, "...Amount
  // DebitCreditBeforeAfter..." on the next. "Settlement" and "Debit" are
  // never adjacent in the extracted text, so match the actual squished
  // patterns instead.
  if (/Settlement\s*Settlement/i.test(t) && /Debit\s*Credit\s*Before\s*After/i.test(t)) return 'moniepointbiz';
  if (/Trans\.?\s*Time\s+Value\s+Date/i.test(t) && /Wallet\s*Account/i.test(t)) return 'opay';
  // Mono-aggregator wallet statement — a third-party data aggregator's OWN
  // PDF template, not a native bank/wallet export. Structurally distinct
  // from the native OPay format above: numbered transaction list with a
  // "# DATE NARRATION DEBIT CREDIT BALANCE" header, and "Wallet Account"
  // appears in an "Account Type / Currency" field rather than as a column
  // header. This template's own Balance column is a known broken
  // placeholder (always "0.00" on every row, cover page included) — see
  // the noBalanceData handling in extractCoverStats/authChecks.
  if (/Wallet\s*Account/i.test(t) && /#\s*DATE\s+NARRATION\s+DEBIT\s+CREDIT\s+BALANCE/i.test(t)) return 'monoagg';
  // Stanbic IBTC — bare bank-name text is not enough on its own: it can
  // appear as a counterparty's institution name on another bank's
  // statement (found on a real Moniepoint business statement where a
  // customer paid in via Stanbic IBTC). Require an actual Stanbic-specific
  // structural marker from their own statement template instead of just
  // the bank name floating in a narration or metadata field.
  if (/INFLOW\s*VS\s*OUTFLOW/i.test(t) ||
      /ACCOUNT\s*NUMBER[^|]+\|\s*CURRENCY/i.test(t) || /POSTEDCREATE/i.test(t)) return 'stanbic';
  if (/alternative\s*bank/i.test(t) || /altbank\.ng/i.test(t) ||
     (/DATE\s+REFERENCE\s+NARRATION/i.test(t) && /DEBIT\s+CREDIT\s+BALANCE/i.test(t))) return 'altbank';
  if (/Guaranty\s*Trust/i.test(t) || /GTBank/i.test(t)) return 'gtbank';
  // FCMB (First City Monument Bank) — must be checked BEFORE the generic
  // Access Bank check below. FCMB statements routinely contain narration text
  // like "web:App To ACCESS BANK PLC DIAMOND..." (a third-party recipient bank
  // name embedded in the transaction description), which would otherwise
  // false-positive match /Access\s*Bank/i and misroute to the wrong parser.
  if (/FCMB/i.test(t) || /First\s*City\s*Monument\s*Bank/i.test(t) ||
      (/ValueDate/i.test(t) && /Deposit/i.test(t) && /Withdrawal/i.test(t))) return 'fcmb';
  // OmniPay Wallet Statement — detected first because narrations frequently
  // contain "Access Bank", "Opay" etc. as recipient bank names. However, the
  // word "OmniPay" also appears in Access Bank narrations as a counterparty name,
  // so we MUST require the specific cover-page phrase "OmniPay Wallet Statement"
  // rather than just "/OmniPay/i" alone.
  if (/OmniPay\s+Wallet\s+Statement/i.test(t)) return 'omnipay';
  // Access Bank Nigeria app/email statement — "ACCOUNT STATEMENT" cover page with
  // "Posted Date / Value Date / Description / Debit (NGN) / Credit (NGN) / Balance (NGN)"
  // table and DD-MON-YY dates. The footer "accessbankplc.com" appears only on the
  // last page, so we also match on the distinctive column header combination which
  // uniquely identifies this format (no other Access Bank format uses all three of
  // Posted Date, Value Date, and "Debit (NGN)").
  if ((/accessbankplc\.com/i.test(t) || /contactcenter@accessbank/i.test(t) ||
       (/Posted\s*Date/i.test(t) && /Value\s*Date/i.test(t) && /Debit\s*\(NGN\)/i.test(t))) &&
      /Debit\s*\(NGN\)/i.test(t)) return 'accessng';
  // Access Bank web export: has "# DATE NARRATION DEBIT CREDIT BALANCE" header
  // and US-style dates (Jun 17, 2025). Must be checked before generic 'access'.
  if (/Access\s*Bank/i.test(t) &&
      (/#\s*DATE\s+NARRATION/i.test(t) ||
       /Account\s*statement\s*from\s+\w+\s+\d+,\s*\d{4}/i.test(t) ||
       /Total\s*debits[\s\S]{0,40}Total\s*credits/i.test(t))) return 'accessweb';
  if (/Access\s*Bank/i.test(t)) return 'access';
  if (/kuda/i.test(t)) return 'kuda';
  if (/Providus/i.test(t)) return 'providus';
  // Access Bank DBA Premium / legacy DiamondXtra product — Withdrawals/
  // Lodgements columns, M/D/YYYY dates. DIAMONDXTRA is a Diamond Bank
  // product name inherited by Access Bank after the 2019 merger, NOT a
  // Wema Bank product — checked here, before 'wema', and deliberately does
  // NOT require "Access Bank" as literal text, because on real DBA Premium
  // statements that text often appears only deep in transaction narrations
  // (e.g. as a counterparty's bank name), thousands of characters past this
  // function's 6000-char scan window — a rule gated on it would never fire.
  if (/DIAMONDXTRA/i.test(t) || /DBA\s*[-–]\s*PREMIUM/i.test(t) ||
      (/TOTAL\s*WITHDRAWALS/i.test(t) && /TOTAL\s*LODGEMENTS/i.test(t))) return 'accessdba';
  // Wema Bank — kept narrow: literal bank name only, since the structural
  // signals above belong to Access/Diamond DBA Premium, not Wema.
  if (/Wema\s*Bank/i.test(t)) return 'wema';
  if (/TAJBank/i.test(t) || /tajconnect@tajbank/i.test(t)) return 'tajbank';
  if (/keystonebankng\.com/i.test(t) || /Keystone\s*Bank/i.test(t)) return 'keystone';
  // (Moniepoint is detected structurally at the top of this function, per §4.)
  // Zenith Bank
  if (/ZENITH\s*BANK/i.test(t)) return 'zenith';
  // Wema ALAT Business (Balance-first column layout, numeric DD-MM-YYYY dates)
  if (/Opening\s*Bal:/i.test(t) && /MY\s*BUSINESS\s*ACCOUNT/i.test(t)) return 'alatbiz';

  if (/alat\.ng/i.test(t) || /wemabank\.com/i.test(t) ||
      /MY\s*BUSINESS\s*ACCOUNT/i.test(t) ||
      /FOR\s*BUSINESS/i.test(t)) return 'alat';
  // Union Bank of Nigeria — match logo text, their "TRANSACCTNAMION" column header typo, or POST/VALUE DATE combo
  if (/union\s*bank/i.test(t) || /TRANSACCTNAMION/i.test(t) ||
      (/STATEMENT\s*OF\s*ACCOUNT/i.test(t) && /POST\s*DATE/i.test(t) && /VALUE\s*DATE/i.test(t))) return 'unionbank';
  return 'generic'; // fallback — attempt best-effort parse
}

// ── Cover Stats ──────────────────────────────────────────────────
function extractCoverStats(text, fmt) {
  const lines = text.split('\n');
  const after = (pat) => {
    for (let i=0; i<Math.min(lines.length,80); i++) {
      if (pat.test(lines[i])) {
        for (let j=i; j<=Math.min(i+3,lines.length-1); j++) {
          const m=lines[j].match(/-?[\d,]+\.?\d*/);
          if (m && m[0].includes('.')) return toNum(m[0]);
          if (m && m[0].length>3) return toNum(m[0]);
        }
      }
    }
    return null;
  };
  const re  = (pat,idx=1) => { const m=text.match(pat); return m?m[idx].trim():''; };
  const reN = (pat)       => { const m=text.match(pat); return m?toNum(m[1]):null; };
  const fN  = (str)       => { const m=(str||'').match(/([\d,]+\.\d{2})/); return m?toNum(m[1]):null; };

  if (fmt==='opay') return {
    opening:after(/Opening\s*Balance/i), closing:after(/Closing\s*Balance/i),
    statedDr:after(/Total\s*Debit(?!\s*Count)/i), statedCr:after(/Total\s*Credit(?!\s*Count)/i),
    drCount:reN(/Debit\s*Count\s*\n?(\d+)/i), crCount:reN(/Credit\s*Count\s*\n?(\d+)/i),
    acctName:re(/Account\s*Name\s*\n([^\n]+)/i), acctNum:re(/Account\s*Number\s*\n([^\n]+)/i),
    period:(()=>{ const m=text.match(/Period[^–\-\d]*(\d{2}\s+\w{3}\s+\d{4})[^–\-\d]*(\d{2}\s+\w{3}\s+\d{4})/i); return m?`${m[1]} – ${m[2]}`:''; })(),
  };

  if (fmt==='stanbic') {
    const si = k => text.search(k);
    const acctNumMatch = text.match(/ACCOUNT\s*NUMBER[:\s|]+(\d{10})/i);
    const periodMatch  = text.match(/FROM\s*\n([^\n]+)\nTO\s*\n([^\n]+)/i);
    return {
      opening: si(/Opening\s*Balance/i)>=0 ? fN(text.slice(si(/Opening\s*Balance/i))) : null,
      closing: si(/Current\s*Balance/i)>=0  ? fN(text.slice(si(/Current\s*Balance/i)))  : null,
      statedDr:null, statedCr:null, drCount:null, crCount:null,
      acctName:(()=>{ const m=text.match(/^041\s+([A-Z][A-Z\s]+)/m); return m?m[1].trim():''; })(),
      acctNum:acctNumMatch?acctNumMatch[1]:'',
      period:periodMatch?`${periodMatch[1].trim()} – ${periodMatch[2].trim()}`:'',
    };
  }

  if (fmt==='altbank') return {
    opening:after(/Opening\s*Balance/i), closing:after(/Closing\s*Balance/i),
    statedDr:(()=>{ const m=text.match(/Total\s*Debit[^₦\d]*([\d,]+\.\d{2})/i); return m?toNum(m[1]):null; })(),
    statedCr:(()=>{ const m=text.match(/Total\s*Credit[^₦\d]*([\d,]+\.\d{2})/i); return m?toNum(m[1]):null; })(),
    drCount:reN(/Total\s*Debit[:\s]*\((\d+)\)/i), crCount:reN(/Total\s*Credit[:\s]*\((\d+)\)/i),
    acctName:re(/([A-Z][A-Z\s]+(?:ENTERPRISE|LIMITED|NIGERIA|VENTURES))/i)||'',
    acctNum:(()=>{ const m=text.match(/\b(\d{10})\b/); return m?m[1]:''; })(),
    period:(()=>{ const m=text.match(/(\w{3}\s+\d{2}\s+\d{4})\s*-\s*(\w{3}\s+\d{2}\s+\d{4})/i); return m?`${m[1]} – ${m[2]}`:''; })(),
  };

  if (fmt === 'keystone') {
    const nameMatch = text.match(/Account\s*Name\s*\n([^\n]+)/i);
    const numMatch  = text.match(/Account\s*No\.\s*-\s*(\d+)/i);
    const periodM   = text.match(/Summary\s*Statement\s*for\s*([^\n]+)\s*To\s*([^\n]+)/i);
    return {
      opening:  after(/Opening\s*Balance\s*-/i),
      closing:  after(/Closing\s*Balance\s*-/i),
      statedDr: after(/Total\s*Debits\s*-/i),
      statedCr: after(/Total\s*Credits\s*-/i),
      drCount:  null,
      crCount:  null,
      acctName: nameMatch ? nameMatch[1].trim() : '',
      acctNum:  numMatch  ? numMatch[1] : '',
      period:   periodM ? `${periodM[1].trim()} – ${periodM[2].trim()}` : '',
    };
  }

  if (fmt === 'alatbiz') {
    const nameMatch = text.match(/Acct\s*Name:\s*([^\n]+)/i);
    const numMatch  = text.match(/Acct\s*No:\s*(\d+)/i);
    const periodM   = text.match(/(\d{2}\/\d{2}\/\d{4})\s*(?:To)?\s*(\d{2}\/\d{2}\/\d{4})/i);
    return {
      opening:  after(/Opening\s*Bal:/i),
      closing:  after(/Closing\s*Bal:/i),
      statedDr: after(/Total\s*Debit:/i),
      statedCr: after(/Total\s*Credit:/i),
      drCount:  reN(/Debit\s*Count:\s*(\d+)/i),
      crCount:  reN(/Credit\s*Count:\s*(\d+)/i),
      acctName: nameMatch ? nameMatch[1].trim() : '',
      acctNum:  numMatch  ? numMatch[1] : '',
      period:   periodM ? `${periodM[1]} – ${periodM[2]}` : '',
    };
  }

  if (fmt === 'alat') {
    const acctNumMatch = text.match(/Account\s*Number\s*\n(\d+)/i);
    const nameMatch    = text.match(/Account\s*Name\s*\n([^\n]+)/i);
    const startMatch   = text.match(/Start\s*Date\s*\n([^\n]+)/i);
    const endMatch     = text.match(/End\s*Date\s*\n([^\n]+)/i);
    return {
      opening:  null, // cover opening mismatches first txn; derive from txn flow
      closing:  after(/Closing\s*Balance/i),
      statedDr: after(/Total\s*Debit/i),
      statedCr: after(/Total\s*Credit(?!\s*Count)/i),
      drCount:  reN(/Debit\s*Count\s*\n?(\d+)/i),
      crCount:  reN(/Credit\s*Count\s*\n?(\d+)/i),
      acctName: nameMatch ? nameMatch[1].trim() : '',
      acctNum:  acctNumMatch ? acctNumMatch[1] : '',
      period:   (startMatch && endMatch) ? `${startMatch[1].trim()} – ${endMatch[1].trim()}` : '',
    };
  }

  if (fmt === 'wema' || fmt === 'accessdba') {
    const acctMatch   = text.match(/ACCOUNT\s*NO[\.\s:]*(\d{7,12})/i);
    // Real DBA Premium cover pages are two-column: "Account Name" label sits
    // on one line, the customer's actual name on the next — but that next
    // line often gets glued to the right column's "TOTAL LODGEMENTS ..."
    // text with no space (row-bucketed text extraction has no notion of
    // columns), with a "TOTAL WITHDRAWALS ..." line from the right column
    // sometimes sitting in between. A loose "next ALL-CAPS run after
    // Account" regex grabs "TOTAL WITHDRAWALS" instead of the real name —
    // this anchors on the literal "Account Name" label and explicitly
    // skips past that interleaved line.
    const nameMatch   = text.match(/Account\s*Name\s*\n(?:TOTAL\s*WITHDRAWALS[^\n]*\n)?([A-Z][A-Za-z\s]+?)(?:TOTAL\s*LODGEMENTS|\n|$)/i);
    const periodMatch = text.match(/(\d{1,2}\/\d{1,2}\/\d{4})\s+\d{2}:\d{2}:\d{2}\s+[A-Z]+\s+To\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);
    return {
      opening:  after(/OPENING\s*BALANCE/i),
      closing:  after(/CLOSING\s*BALANCE/i),
      statedDr: after(/TOTAL\s*WITHDRAWALS/i),
      statedCr: after(/TOTAL\s*LODGEMENTS/i),
      drCount: null, crCount: null,
      acctName: nameMatch ? nameMatch[1].trim() : '',
      acctNum:  acctMatch ? acctMatch[1] : '',
      period:   periodMatch ? periodMatch[1] + ' – ' + periodMatch[2] : '',
    };
  }

  if (fmt === 'unionbank') {
    // Union Bank summary block at end: "OPENING BALANCE = 235767.5"
    // "TOTAL DEBIT AMT = 14,080,996.40  DR Count = 409"
    // "TOTAL CREDIT AMT = 14,073,681.94  CR Count = 383"
    // "CLOSING BALANCE = 215353.04"
    const ubNum = pat => { const m = text.match(pat); return m ? toNum(m[1]) : null; };
    const ubInt = pat => { const m = text.match(pat); return m ? parseInt(m[1], 10) : null; };
    const nameM   = text.match(/^([A-Z][A-Z\s]{4,40})\s*\n/m);
    const acctM   = text.match(/ACCOUNT\s*NO[.:]*\s*(\d{7,13})/i);
    const startM  = text.match(/Start\s*Date[:\s]*(\d{2}\s+\w{3},?\s+\d{4})/i);
    const endM    = text.match(/End\s*Date[:\s]*(\d{2}\s+\w{3},?\s+\d{4})/i);
    return {
      opening:  ubNum(/OPENING\s*BALANCE\s*=\s*([\d,]+\.?\d*)/i),
      closing:  ubNum(/CLOSING\s*BALANCE\s*=\s*([\d,]+\.?\d*)/i),
      statedDr: ubNum(/TOTAL\s*DEBIT\s*AMT\s*=\s*([\d,]+\.?\d*)/i),
      statedCr: ubNum(/TOTAL\s*CREDIT\s*AMT\s*=\s*([\d,]+\.?\d*)/i),
      drCount:  ubInt(/DR\s*Count\s*=\s*(\d+)/i),
      crCount:  ubInt(/CR\s*Count\s*=\s*(\d+)/i),
      acctName: nameM ? nameM[1].trim() : '',
      acctNum:  acctM ? acctM[1] : '',
      period:   (startM && endM) ? `${startM[1].trim()} – ${endM[1].trim()}` : '',
    };
  }

  if (fmt === 'accessweb') {
    // Access Bank web export header: account name on line 3, account number below "Account Number"
    // "Total debits\nNGN X" and "Total credits\nNGN X"
    // "Account statement from Jun 16, 2025 to Jun 16, 2026"
    const awNum = pat => { const m = text.match(pat); return m ? toNum(m[1].replace(/[^0-9.]/g,'')) : null; };
    const nameM   = text.match(/^(.+?)\s+\S+\s*\n/m);  // line 3 has "HELLEN BIDEMI GOODLUCK helenbidemigoodluck"
    const acctM   = text.match(/Account\s*Number\s*\n(\d{10})/i);
    const periodM = text.match(/Account\s*statement\s*from\s+(\w+\s+\d+,\s*\d{4})\s+to\s+(\w+\s+\d+,\s*\d{4})/i);
    const nameClean = nameM ? nameM[1].replace(/[a-z]{6,}$/, '').trim() : ''; // strip username suffix
    return {
      opening:  null,
      closing:  awNum(/Available\s*balance\s*\nNGN\s*([\d,]+\.?\d*)/i),
      statedDr: awNum(/Total\s*debits\s*\nNGN\s*([\d,]+\.?\d*)/i),
      statedCr: awNum(/Total\s*credits\s*\nNGN\s*([\d,]+\.?\d*)/i),
      drCount:  null,
      crCount:  awNum(/All\s+(\d+)\s+transactions/i),
      acctName: nameClean,
      acctNum:  acctM ? acctM[1] : '',
      period:   periodM ? `${periodM[1]} – ${periodM[2]}` : '',
    };
  }

  if (fmt === 'moniepoint') {
    // Moniepoint cover page: "Business Name\n<name>", "Account Number\n<num>",
    // "Date\n<dd/mm/yyyy> - <dd/mm/yyyy>", "Opening Balance ... <amt>",
    // "Total Debits <amt>", "Total Credits <amt>", "Closing Balance ... <amt>"
    const nameM   = text.match(/Business\s*Name\s*\n\s*([^\n]+)/i);
    const acctM   = text.match(/Account\s*Number\s*\n\s*(\d{6,13})/i);
    const periodM = text.match(/Date\s*\n\s*(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/i);
    const openM   = text.match(/Opening\s*Balance\s*\n?\s*([\d,]+\.\d{2})/i);
    const closeM  = text.match(/Closing\s*Balance\s*\n?\s*([\d,]+\.\d{2})/i);
    const drM     = text.match(/Total\s*Debits\s*([\d,]+\.\d{2})/i);
    const crM     = text.match(/Total\s*Credits\s*([\d,]+\.\d{2})/i);
    return {
      opening:  openM ? toNum(openM[1]) : null,
      closing:  closeM ? toNum(closeM[1]) : null,
      statedDr: drM ? toNum(drM[1]) : null,
      statedCr: crM ? toNum(crM[1]) : null,
      drCount: null, crCount: null,
      acctName: nameM ? nameM[1].trim() : '',
      acctNum:  acctM ? acctM[1] : '',
      period:   periodM ? `${periodM[1]} – ${periodM[2]}` : '',
    };
  }

  if (fmt === 'moniepointbiz') {
    // Moniepoint "business/detailed" export cover page — same label/value
    // conventions as the consumer format above, but label and value often
    // land on the same row rather than adjacent rows, since this format's
    // two-column cover layout row-buckets differently. \s+ (rather than
    // \s*\n?\s*) handles both.
    const nameM   = text.match(/Business\s*Name\s+([^\n]+)/i);
    const acctM   = text.match(/Account\s*Number\s+(\d{6,13})/i);
    const periodM = text.match(/Date\s+(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/i);
    const openM   = text.match(/Opening\s*Balance\s+([\d,]+\.\d{2})/i);
    const closeM  = text.match(/Closing\s*Balance\s+([\d,]+\.\d{2})/i);
    const drM     = text.match(/Total\s*Debits\s+([\d,]+\.\d{2})/i);
    const crM     = text.match(/Total\s*Credits\s+([\d,]+\.\d{2})/i);
    return {
      opening:  openM ? toNum(openM[1]) : null,
      closing:  closeM ? toNum(closeM[1]) : null,
      statedDr: drM ? toNum(drM[1]) : null,
      statedCr: crM ? toNum(crM[1]) : null,
      drCount: null, crCount: null,
      acctName: nameM ? nameM[1].trim() : '',
      acctNum:  acctM ? acctM[1] : '',
      period:   periodM ? `${periodM[1]} – ${periodM[2]}` : '',
    };
  }

  if (fmt === 'monoagg') {
    // Mono-aggregator cover page is a multi-column layout that glues label
    // and value text from adjacent columns together with no separator
    // (e.g. "8079473736Opay", three "NGN X.XX" amounts run together with
    // zero space between them). No usable balance column exists anywhere
    // in this export (every row, including the cover page, prints a
    // placeholder "NGN 0.00") — noBalanceData signals authChecks to skip
    // balance-based reconciliation entirely and rely on stated totals.
    const nameM = text.match(/([A-Z][A-Z\s]{4,50})\n\s*Contact\b/);
    const acctM = text.match(/Account\s*Number[A-Za-z]*\s*\n?\s*(\d{6,13})/i);
    const bankM = text.match(/Account\s*Number[A-Za-z]*\s*\n?\s*\d{6,13}([A-Za-z]+)/i);
    const amts  = [...text.matchAll(/NGN\s*([\d,]+\.\d{2})/gi)].slice(0,3).map(m => toNum(m[1]));
    const periodM = text.match(/NGN([A-Za-z]{3}\s+\d{1,2},\s*\d{4})\s*to\s*([A-Za-z]{3}\s+\d{1,2},\s*\d{4})/i);
    return {
      opening: null, closing: null, noBalanceData: true,
      statedDr: amts.length >= 2 ? amts[1] : null,
      statedCr: amts.length >= 3 ? amts[2] : null,
      drCount: null, crCount: null,
      acctName: nameM ? nameM[1].trim() : '',
      acctNum:  acctM ? acctM[1] : '',
      underlyingBank: bankM ? bankM[1].trim() : '',
      period:   periodM ? `${periodM[1]} – ${periodM[2]}` : '',
    };
  }

  // Generic fallback — try common label variants
  return {
    opening:  after(/Opening\s*Balance/i) || after(/OPENING\s*BALANCE/i),
    closing:  after(/Closing\s*Balance/i)  || after(/CLOSING\s*BALANCE/i),
    statedDr: after(/Total\s*Debit(?!\s*Count)/i) || after(/TOTAL\s*WITHDRAWALS/i),
    statedCr: after(/Total\s*Credit(?!\s*Count)/i) || after(/TOTAL\s*LODGEMENTS/i),
    drCount: null, crCount: null,
    acctName: (()=>{ const m=text.match(/Account\s*Name[:\s|]*([A-Z][A-Za-z .,&'-]{3,40})/i) || text.match(/^([A-Z]{2}[A-Z ]{4,40})\s*$/m); return m?m[1].trim():''; })(),
    acctNum:  (()=>{ const m=text.match(/Account\s*N(?:o|umber)[:\s\.]*(\d{10})/i); return m?m[1]:''; })(),
    period:   '',
  };
}

// ── buildTxnsDirect ──────────────────────────────────────────────
// For formats where debit/credit are read from explicit columns (not derived).
// Avoids the balance-diff problem on wallet accounts that oscillate to ₦0.
function buildTxnsDirect(records) {
  return records
    .filter(r => r.date instanceof Date && !isNaN(r.date.getTime()))
    .map(r => ({
      date:      r.date,
      debit:     Math.max(0, r.debit  || 0),
      credit:    Math.max(0, r.credit || 0),
      balance:   r.balance || 0,
      narration: (r.narration || '').slice(0, 80).trim(),
      cat:       categorise(r.narration || '', (r.credit || 0) > 0),
      ...(r.balanceAnomaly ? { balanceAnomaly: true } : {}),
    }));
}

// ── buildTxns ────────────────────────────────────────────────────
function buildTxns(records, opening) {
  const txns = [];
  let prev = opening || 0;
  for (const r of records) {
    const { date, balance, narration='' } = r;
    if (!(date instanceof Date) || isNaN(date.getTime())) continue;
    const diff = Math.round((balance - prev)*100)/100;
    const debit  = diff < -0.005 ? -diff : 0;
    const credit = diff >  0.005 ?  diff : 0;
    const cat = categorise(narration, credit > 0);
    txns.push({ date, debit, credit, balance, narration, cat });
    prev = balance;
  }
  return txns;
}

// ── PARSERS ──────────────────────────────────────────────────────

function parseOPay(lines, opening) {
  // OPay renders each transaction twice (merged reference row + normal data row).
  // Both appear at different Y positions so Y-bucketing gives two separate lines per txn.
  // Dedup by timestamp, keep entry with longest description (phantom has blank/garbled narr).
  //
  // Root cause of the ₦138B bug: tokens[-3] shifts onto garbage when pdf.js concatenates
  // continuation lines into the block, prepending extra large "amounts" (actually reference
  // number fragments). Fix: scan BACKWARDS through the token array for the last valid
  // OPay triplet (debit, credit, balance) where:
  //   - neither debit nor credit exceeds MAX_AMT (₦5M wallet ceiling)
  //   - debit and credit can NOT both be positive (one is always 0 from "--")
  // This reliably skips any garbage tokens at the front of the list.
  //
  // FIN_TOK: restricted to properly comma-formatted amounts OR simple ≤6-digit amounts.
  // This prevents long unformatted digit strings from matching even if a decimal appears.

  const ANCHOR  = /^(\d{2}) ([A-Za-z]{3}) (\d{4}) (\d{2}:\d{2}:\d{2})/;
  const FIN_TOK = /--|\b\d{1,3}(?:,\d{3})*\.\d{2}\b|\b\d{1,6}\.\d{2}\b/g;
  const MAX_AMT = 5_000_000;
  const candidates = {};

  let i = 0;
  while (i < lines.length) {
    const line = lines[i].trim();
    const m    = ANCHOR.exec(line);
    if (!m) { i++; continue; }

    const date    = new Date(Date.UTC(+m[3], MONTHS[m[2]] ?? 0, +m[1]));
    const timeKey = m[4];
    const key     = `${date.toISOString().slice(0,10)}|${timeKey}`;

    let block = line, j = i + 1;
    while (j < lines.length && j < i + 8) {
      const nxt = lines[j].trim();
      if (ANCHOR.test(nxt)) break;
      block += ' ' + nxt;
      j++;
    }

    const tokens = [];
    let tk;
    FIN_TOK.lastIndex = 0;
    while ((tk = FIN_TOK.exec(block)) !== null) {
      tokens.push(tk[0] === '--' ? 0 : toNum(tk[0]));
    }

    if (tokens.length >= 3) {
      // Scan backwards for last valid (debit, credit, balance) triplet
      let debit = 0, credit = 0, balance = 0, found = false;
      for (let k = tokens.length - 3; k >= 0; k--) {
        const d = tokens[k], c = tokens[k + 1], b = tokens[k + 2];
        if (d <= MAX_AMT && c <= MAX_AMT && !(d > 0 && c > 0)) {
          debit = d; credit = c; balance = b; found = true;
          break;
        }
      }
      if (!found) { i = j; continue; }

      const narration = cleanNarr(block);
      const existing  = candidates[key];
      if (!existing || narration.length > existing.narration.length) {
        candidates[key] = { date, debit, credit, balance, narration };
      }
    }
    i = j;
  }

  const records = Object.values(candidates).sort((a, b) => a.date - b.date);
  return buildTxnsDirect(records);
}

function parseAltBank(lines, opening) {
  const DATE = /^(\d{2})-([A-Za-z]{3})-(\d{4})/;
  const BARE = /^[\d,]+\.\d{2}$/;
  const PAGE = /^\d{1,3}$/;
  const AMTS = /[\d,]+\.\d{2}/g;
  const records = [];
  let orphan = null, i = 0;
  while (i < lines.length) {
    const line = lines[i].trim();
    if (!line || PAGE.test(line)) { i++; continue; }
    if (BARE.test(line)) { orphan = toNum(line); i++; continue; }
    const m = DATE.exec(line);
    if (!m) { i++; continue; }
    const mon = m[2].charAt(0).toUpperCase()+m[2].slice(1).toLowerCase();
    const date = new Date(Date.UTC(+m[3], MONTHS[mon]??0, +m[1]));
    const myOrphan = orphan; orphan = null;
    let merged = line, j = i+1;
    while (j < lines.length) {
      const nxt = lines[j].trim();
      if (!nxt || PAGE.test(nxt)) { j++; continue; }
      if (DATE.test(nxt) || BARE.test(nxt)) break;
      merged += ' ' + nxt; j++;
      if ((merged.match(AMTS)||[]).length >= 2) break;
    }
    const amts = [...merged.matchAll(AMTS)].map(x=>toNum(x[0]));
    let balance;
    if (amts.length >= 2) balance = amts[amts.length-1];
    else if (amts.length===1 && myOrphan!==null) balance = myOrphan;
    else { i=j; continue; }
    records.push({ date, balance, narration:cleanNarr(merged) });
    i = j;
  }
  return buildTxns(records, opening);
}

// ── STANBIC IBTC ─────────────────────────────────────────────────
// Stanbic IBTC PDFs (PDFium/Chromium-rendered) have a six-column table:
//   POSTED DATE | CREATE DATE | NARRATION | DEBIT | CREDIT | BALANCE
//
// pdf.js extracts items column-by-column rather than row-by-row, so the
// line-based parser is unreliable. We use the same coordinate-based strategy
// as the Union Bank parser: group text items by y-position into row bands,
// then classify each item's column by x-coordinate.
//
// Column layout (x-coordinates observed from this statement):
//   POSTED DATE   x0  25 – 75    (day+month on one row, year below: "26 May" / "2026")
//   CREATE DATE   x0  76 – 140   (same two-line pattern — we skip it)
//   NARRATION     x0 140 – 400   (multi-token, spans several sub-rows)
//   DEBIT         x1 380 – 450   (right-aligned; "–" dashes appear as missing → 0)
//   CREDIT        x1 451 – 510   (right-aligned)
//   BALANCE       x1 510+        (right-aligned; always present)
//
// This function is async because it re-parses via pdf.js getTextContent().
async function parseStanbic(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

  const MONTH_MAP = {
    jan:0,feb:1,mar:2,apr:3,may:4,jun:5,
    jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
  };

  const records = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    const page    = await pdf.getPage(p);
    const content = await page.getTextContent();
    page.cleanup();

    // Collect all text items with bounding-box info
    const items = [];
    for (const it of content.items) {
      const s = (it.str || '').trim();
      if (!s) continue;
      const x0 = it.transform[4];
      const x1 = x0 + (it.width || 0);
      const y  = it.transform[5];
      items.push({ x0, x1, y, s });
    }
    if (!items.length) continue;

    // ── Group items into y-rows (tolerance ±5px) ──────────────────
    const rows = [];
    for (const it of items) {
      const existing = rows.find(r => Math.abs(r.y - it.y) <= 5);
      if (existing) existing.items.push(it);
      else rows.push({ y: it.y, items: [it] });
    }
    // Sort rows top→bottom (largest y first in PDF coordinate space)
    rows.sort((a, b) => b.y - a.y);
    for (const row of rows) row.items.sort((a, b) => a.x0 - b.x0);

    // ── Merge adjacent rows into transaction bands (gap ≤ 16px) ───
    // Stanbic date cells span two sub-rows: "26 May" on top, "2026" below.
    // Narration also wraps. Band tolerance must be wide enough to capture both
    // sub-rows of a multi-line cell but not bleed into the next transaction.
    const bands = [];
    let band = null;
    for (const row of rows) {
      if (!band || Math.abs(row.y - band.anchorY) > 16) {
