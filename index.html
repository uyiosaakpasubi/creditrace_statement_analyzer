    setProg(`Deterministic parsers found nothing for "${FNAMES[fmt]||fmt}" — trying Claude AI…`, 57);
    await sleep(300);
    txns = await claudeExtract(pages, fmt);
    usedClaude = true;
  }

  if (txns.length === 0) {
    // Formats that have a dedicated parser — if they return nothing, the layout
    // probably changed or the pdf.js extraction differs from what the parser expects.
    const NATIVE = new Set(['opay','altbank','stanbic','gtbank','access','accessdba','accessweb',
      'kuda','providus','tajbank','alat','alatbiz','keystone','wema','zenith','moniepoint','moniepointbiz','monoagg','unionbank','fcmb','accessng','omnipay']);
    const bank = FNAMES[fmt] || fmt;
    const hasParser = NATIVE.has(fmt);
    throw new Error(
      hasParser
        ? `${bank} was detected but neither the native nor the universal parser found transactions. The PDF layout may be image-based (scanned) or heavily non-standard.` +
          (apiKey ? '' : ' Add a Claude API key for automatic AI fallback.')
        : `"${bank}" is not yet natively supported and the universal parser found no table structure.` +
          (apiKey ? '' : ' Optionally add a Claude API key on the upload page to attempt AI extraction.')
    );
  }

  setProg('Running integrity checks…', 93); await sleep(40);
  const checks = authChecks(fullText, txns, cs, fmt);

  setProg('Building monthly summary…', 96); await sleep(40);
  const monthly = aggregate(txns);

  setProg('Computing insights…', 98); await sleep(40);
  const insights = computeInsights(txns, monthly);

  return {
    fmt, cs, checks, monthly, txns, insights, fullText,
    fname: file.name.replace(/\.pdf$/i, '').replace(/_/g, ' '),
    usedClaude, usedUniversal,
  };
}

async function analyse(file) {
  clearErr();
  $('mainArea').innerHTML = `
    <div class="prog-page">
      <div class="prog-spinner"></div>
      <div class="prog-lbl" id="progLbl">Loading PDF…</div>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="claude-prog" id="claudeProg"></div>
    </div>`;
  updateNav('');

  try {
    state = await parseStatementCore(file);
    setProg('Done', 100); await sleep(200);
    navigate('overview');

  } catch (err) {
    renderPage('upload');
    updateNav('upload');
    setTimeout(() => setErr(err.message || 'An unexpected error occurred.'), 50);
    console.error('[BankLens]', err);
  }
}

// ── CrediTrace: multi-statement case state ─────────────────────────
// ct.statements: [{ id, file, fname, status:'pending'|'ok'|'quarantined',
//                    error, fmt, cs, txns, checks, reconciled }]
let ct = { statements: [], appAccountId: null, appDate: '', decisions: {} };

// ── CrediTrace: analyst decisions (Checkpoint 4) ────────────────────
// decisions[id] = { verdict: 'upheld' | 'dismissed', note: string }
// Absence of an entry (or verdict 'pending') means: use the default
// tier-based treatment — confirmed/probable pairs and undisclosed flags
// count toward the ladder by default; behavioural flags (in-and-out,
// round-figure) do NOT count by default and only enter the ladder if the
// analyst explicitly upholds them (§6.6/§6.8: pairing can't prove these,
// so they stay out of the automatic math until a human confirms them).
function ctVerdict(id) { return (ct.decisions[id] && ct.decisions[id].verdict) || 'pending'; }
function ctNote(id) { return (ct.decisions[id] && ct.decisions[id].note) || ''; }
function ctSetVerdict(id, verdict) {
  if (!ct.decisions[id]) ct.decisions[id] = { verdict: 'pending', note: '' };
  ct.decisions[id].verdict = verdict;
}
function ctSetNote(id, note) {
  if (!ct.decisions[id]) ct.decisions[id] = { verdict: 'pending', note: '' };
  ct.decisions[id].note = note;
}

function ctNormAcct(n) { return (n || '').replace(/\D/g, ''); }

// Small non-cryptographic hash — collisions across genuinely different
// narrations are astronomically unlikely once combined with account,
// timestamp, debit, credit, and balance-after in the dedup key.
function ctHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}

// Dedup key per §5: account number + timestamp + debit + credit +
// balance-after + narration hash. Balance-after makes collisions between
// distinct transactions essentially impossible even for identical POS
// purchases seconds apart. Never dedup on timestamp alone.
function ctTxnKey(acctNum, t) {
  const dateKey  = (t.date instanceof Date && !isNaN(t.date)) ? t.date.getTime() : 'x';
  const narrHash = ctHash((t.narration || '').toLowerCase().replace(/\s+/g, ' ').trim());
  return `${acctNum}|${dateKey}|${(t.debit||0).toFixed(2)}|${(t.credit||0).toFixed(2)}|${(t.balance||0).toFixed(2)}|${narrHash}`;
}

// Dedup never crosses account boundaries — grouped strictly by account
// number. Statements that failed their own reconciliation gate are excluded
// entirely; a quarantined statement never contaminates this analysis.
function ctComputeDedup(statements) {
  const ok = statements.filter(s => s.status === 'ok');
  const byAcct = new Map();
  for (const s of ok) {
    const key = ctNormAcct(s.cs.acctNum) || `__noacct_${s.id}`;
    if (!byAcct.has(key)) byAcct.set(key, []);
    byAcct.get(key).push(s);
  }
  const groups = [];
  for (const [acctNum, stmts] of byAcct.entries()) {
    if (stmts.length < 2) continue; // dedup only meaningful across 2+ statements of the same account
    const seen = new Set();
    let totalBefore = 0, duplicatesRemoved = 0;
    for (const s of stmts) {
      totalBefore += s.txns.length;
      for (const t of s.txns) {
        const k = ctTxnKey(acctNum, t);
        if (seen.has(k)) duplicatesRemoved++;
        else seen.add(k);
      }
    }
    groups.push({
      acctNum, acctName: stmts[0].cs.acctName || '',
      statementIds: stmts.map(s => s.id),
      totalBefore, duplicatesRemoved, totalAfter: totalBefore - duplicatesRemoved,
    });
  }
  return { groups };
}

// Parses one statement through the shared core pipeline, applies the
// per-statement reconciliation gate, and updates the case state. A
// statement that fails reconciliation is quarantined with a clear error —
// it is kept visible but excluded from ctComputeDedup and any future
// cross-statement analysis.
async function ctIngestStatement(file) {
  const id = 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const entry = { id, file, fname: file.name.replace(/\.pdf$/i, ''), status: 'pending', error: null };
  ct.statements.push(entry);
  renderPage('case');

  try {
    const r = await parseStatementCore(file);
    entry.fmt        = r.fmt;
    entry.cs         = r.cs;
    entry.txns       = r.txns;
    entry.checks     = r.checks;
    entry.fname      = r.fname;
    entry.reconciled = !!(r.checks.recon && r.checks.recon.pass);
    entry.status     = entry.reconciled ? 'ok' : 'quarantined';
    entry.error      = entry.reconciled ? null
      : `Reconciliation failed: ${r.checks.recon ? r.checks.recon.note : 'closing balance could not be verified'}.`;
  } catch (e) {
    entry.status = 'quarantined';
    entry.error  = e.message || 'Parsing failed for this file.';
  }

  if (!ct.appAccountId && entry.status === 'ok') ct.appAccountId = entry.id;
  renderPage('case');
  updateNav('case');
}

function ctHandleFiles(files) {
  const room = 4 - ct.statements.length;
  if (room <= 0) { setErr('Maximum of 4 statements — remove one before adding another.'); return; }
  files.filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name))
       .slice(0, room)
       .forEach(f => ctIngestStatement(f));
}

function ctRemoveStatement(id) {
  ct.statements = ct.statements.filter(s => s.id !== id);
  if (ct.appAccountId === id) ct.appAccountId = null;
  renderPage('case');
  updateNav('case');
}

function ctSetAppAccount(id) { ct.appAccountId = id; renderPage('case'); updateNav('case'); }

function ctStmtCard(s) {
  const isApp = ct.appAccountId === s.id;
  if (s.status === 'pending') {
    return `
    <div class="ct-stmt-card">
      <input type="radio" class="ct-stmt-radio" disabled>
      <div class="ct-stmt-body">
        <div class="ct-stmt-top"><span class="ct-stmt-bank">${esc(s.fname)}</span></div>
        <div class="ct-processing">Parsing and reconciling against cover figures…</div>
      </div>
      <span class="ct-badge pending">Parsing</span>
    </div>`;
  }
  if (s.status === 'quarantined') {
    return `
    <div class="ct-stmt-card ct-quarantined">
      <input type="radio" class="ct-stmt-radio" disabled>
      <div class="ct-stmt-body">
        <div class="ct-stmt-top"><span class="ct-stmt-bank">${esc(s.fname)}</span></div>
        <div class="ct-stmt-meta">${esc(s.error || 'Reconciliation failed.')}</div>
      </div>
      <span class="ct-badge fail">Quarantined</span>
      <button class="ct-stmt-remove" data-remove="${s.id}" title="Remove">&times;</button>
    </div>`;
  }
  const cs = s.cs, bank = FNAMES[s.fmt] || s.fmt;
  return `
  <div class="ct-stmt-card">
    <input type="radio" name="ctAppAccount" class="ct-stmt-radio" data-appacct="${s.id}" ${isApp?'checked':''} title="Set as application account">
    <div class="ct-stmt-body">
      <div class="ct-stmt-top">
        <span class="ct-stmt-bank">${esc(bank)}</span>
        ${isApp ? '<span class="ct-stmt-app-tag">Application account</span>' : ''}
      </div>
      <div class="ct-stmt-meta">${esc(cs.acctName||'—')} · acct ${esc(cs.acctNum||'—')} · ${esc(cs.period||'period n/a')} · ${s.txns.length.toLocaleString()} txns</div>
    </div>
    <span class="ct-badge ok">Reconciled</span>
    <button class="ct-stmt-remove" data-remove="${s.id}" title="Remove">&times;</button>
  </div>`;
}

function renderCase() {
  const stmts = ct.statements;
  const dedup = ctComputeDedup(stmts);
  const okCount = stmts.filter(s => s.status === 'ok').length;

  const cards = stmts.length
    ? stmts.map(ctStmtCard).join('')
    : `<div class="ct-empty-note">No statements uploaded yet. Add 2 to 4 PDFs for the loan applicant to begin.</div>`;

  const dedupHtml = dedup.groups.length ? `
    <div class="ct-dedup-card">
      <div class="ct-dedup-title">Same-account duplicates</div>
      ${dedup.groups.map(g => `
        <div class="ct-dedup-row">
          <span>${esc(g.acctName || 'Account')} · acct ${esc(g.acctNum)}</span>
          <span><b>${g.duplicatesRemoved}</b> removed of ${g.totalBefore} (${g.totalAfter} kept)</span>
        </div>`).join('')}
    </div>` : '';

  const statusNote = okCount < 2
    ? `${okCount}/4 reconciled — at least 2 needed to build a case`
    : `${okCount}/4 reconciled — application date and account can be set below`;

  return `
    <div class="ct-page">
      <div class="pg-eyebrow">CrediTrace case</div>
      <div class="pg-title">Build the applicant's statement set.</div>
      <div class="pg-sub">Upload 2 to 4 bank statement PDFs for the loan applicant. Each one is parsed and reconciled against its own cover figures before anything merges — a statement that fails reconciliation is quarantined, never blended in.</div>

      <div class="ct-drop" id="ctDrop">
        <input type="file" accept=".pdf" id="ctFileIn" multiple>
        <svg class="ct-drop-icon" width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M24 6v24M14 20l10 10 10-10M8 34v4a4 4 0 004 4h24a4 4 0 004-4v-4"/></svg>
        <div class="ct-drop-title">${stmts.length >= 4 ? 'Maximum of 4 statements reached' : 'Drop PDFs here, or click to browse'}</div>
        <div class="ct-drop-sub">${statusNote}</div>
      </div>

      <div class="ct-meta-row">
        <div class="ct-field">
          <label>Application date</label>
          <input type="date" id="ctAppDate" value="${esc(ct.appDate||'')}">
        </div>
      </div>

      <div class="ct-stmt-list">${cards}</div>
      ${dedupHtml}
    </div>`;
}

// ── CrediTrace analysis core (Checkpoint 3) ─────────────────────────
// ── CrediTrace analysis core (validated here in Node, then embedded verbatim in HTML) ──

const CT_STOPWORDS = new Set(['LIMITED','LTD','ENTERPRISES','ENTERPRISE','NIGERIA','NIG','GLOBAL','VENTURES',
  'COMPANY','CO','PLC','BUSINESS','TRADING','CONCEPT','CONCEPTS','GROUP','INTERNATIONAL','INTL','AND','THE','OF','FOR']);

function ctNameTokens(name) {
  return (name || '').toUpperCase().replace(/[^A-Z\s]/g, ' ').split(/\s+/)
    .filter(w => w.length >= 3 && !CT_STOPWORDS.has(w));
}

// Requires at least 2 shared tokens when the applicant identity has 2+
// distinctive tokens (e.g. a personal first+last name) — a single shared
// token like "IJEOMA" is a common Nigerian first name and matching on it
// alone produces false positives against unrelated customers. If the
// identity has only one distinctive token (e.g. a one-word brand name
// after stopword-stripping), that single match is meaningful on its own.
function ctFuzzyNameMatch(nameA, nameB) {
  const ta = ctNameTokens(nameA);
  const tb = new Set(ctNameTokens(nameB));
  if (!ta.length) return false;
  const matches = ta.filter(t => tb.has(t));
  const required = Math.min(2, ta.length);
  return matches.length >= required;
}

function ctNormAcct(n) { return (n || '').replace(/\D/g, ''); }

// Best-effort extraction of transfer counterparty signals from a narration.
// Tuned against real Moniepoint, OPay, and generic Nigerian bank narrations.
function ctExtractTransferInfo(narration) {
  const n = narration || '';
  const isOutbound = /^(TRANSFER\s+TO|TRF\s+TO)\b/i.test(n);
  const isInbound  = /^Transfer\s+from\b/i.test(n.trim());
  const tailM = n.match(/\*{3,8}(\d{3,8})/);
  const tail = tailM ? tailM[1] : null;
  let name = null;
  const toM = n.match(/^(?:TRANSFER\s+TO|TRF\s+TO)\s+(.+?)(?:\s+(?:Moniepoint|OPay|Access|GTBank|Zenith|UBA|United\s+Bank|First\s+Bank|Guaranty|Union|Wema|FCMB|Stanbic|Kuda|Providus|Keystone|TAJ|ALAT)\b|\s*\*{3,8}|\/)/i);
  if (toM) name = toM[1].replace(/^Omnipay-/i, '').trim();
  const fromM = n.match(/^Transfer\s+from\s+(.+?)(?:\s+to\s+.+)?$/i);
  if (fromM) name = fromM[1].trim();
  return { isOutbound, isInbound, tail, name };
}

// Cross-statement transfer pairing with confidence tiers, amount-indexed for
// performance. Only transfer-like legs (TRANSFER TO / Transfer from) are
// considered — POS purchases and fees are never pairing candidates.
function ctPairTransfers(statements) {
  const oks = statements.filter(s => s.status === 'ok');

  // Index all inbound credit legs by amount (2dp key) across every statement.
  const creditIndex = new Map();
  for (const s of oks) {
    s.txns.forEach((t, idx) => {
      if (!(t.credit > 0)) return;
      const info = ctExtractTransferInfo(t.narration);
      if (!info.isInbound) return;
      const key = t.credit.toFixed(2);
      if (!creditIndex.has(key)) creditIndex.set(key, []);
      creditIndex.get(key).push({ stmtId: s.id, idx, txn: t, info });
    });
  }

  const usedCredits = new Set();
  const pairs = [];

  for (const debStmt of oks) {
    debStmt.txns.forEach((dt, di) => {
      if (!(dt.debit > 0)) return;
      const info = ctExtractTransferInfo(dt.narration);
      if (!info.isOutbound) return;

      const candidates = (creditIndex.get(dt.debit.toFixed(2)) || [])
        .filter(c => c.stmtId !== debStmt.id && !usedCredits.has(`${c.stmtId}:${c.idx}`));
      if (!candidates.length) return;

      let best = null;
      for (const c of candidates) {
        const crStmt = oks.find(s => s.id === c.stmtId);
        const dayGap = Math.abs(dt.date - c.txn.date) / 86400000;
        const acctTailMatch = info.tail && ctNormAcct(crStmt.cs.acctNum).endsWith(info.tail);
        const nameMatch = info.name && crStmt.cs.acctName && ctFuzzyNameMatch(info.name, crStmt.cs.acctName);
        if (!acctTailMatch && !nameMatch) continue;
        let tier = null;
        if (acctTailMatch && dayGap <= 1.01) tier = 'confirmed';
        else if ((acctTailMatch || nameMatch) && dayGap <= 5) tier = 'probable';
        if (!tier) continue;
        if (!best || (tier === 'confirmed' && best.tier !== 'confirmed') || dayGap < best.dayGap) {
          best = { c, tier, dayGap };
        }
      }
      if (best) {
        usedCredits.add(`${best.c.stmtId}:${best.c.idx}`);
        pairs.push({
          id: `pair_${debStmt.id}_${di}_${best.c.stmtId}_${best.c.idx}`,
          tier: best.tier,
          amount: dt.debit,
          dayGap: best.dayGap,
          debitLeg:  { stmtId: debStmt.id, idx: di, txn: dt },
          creditLeg: { stmtId: best.c.stmtId, idx: best.c.idx, txn: best.c.txn },
        });
      }
    });
  }
  return pairs;
}

// Inflows from a counterparty entity-resolution links to the applicant, but
// for which no matching statement was uploaded. Two signals only, both
// deliberately narrow — a business with many repeat customers will always
// have "recurring names" in its narrations, so recurrence of a generic name
// is NOT evidence of a related account and must not trigger this flag:
//   (a) the counterparty's own masked account number recurs AND the
//       aggregate value is material (>= max(₦50,000, 0.5% of the account's
//       gross credits)) — a strong, rare signal once value-gated;
//   (b) the counterparty's name shares a distinctive token with the
//       applicant's OWN registered identity (business or personal name) —
//       i.e. the applicant's own name/name-fragment appears as the sender
//       of an inbound credit, which is a much rarer and more specific tell
//       than "this customer has paid us before".
function ctDetectUndisclosed(statements, pairedCreditKeys = new Set()) {
  const oks = statements.filter(s => s.status === 'ok');
  const uploadedTails = new Set(oks.map(s => ctNormAcct(s.cs.acctNum).slice(-6)));
  const uploadedNames = oks.map(s => s.cs.acctName).join(' ');
  const grossByStmt = new Map(oks.map(s => [s.id, s.txns.reduce((sum, t) => sum + (t.credit || 0), 0)]));

  const byTail = new Map();
  const nameFlags = [];
  for (const s of oks) {
    s.txns.forEach((t, idx) => {
      if (!(t.credit > 0)) return;
      if (pairedCreditKeys.has(`${s.id}:${idx}`)) return; // already resolved as a confirmed/probable pair
      const info = ctExtractTransferInfo(t.narration);
      if (!info.isInbound || !info.name) return;

      // Signal (b): applicant's own name/name-fragment as sender
      if (ctFuzzyNameMatch(info.name, uploadedNames)) {
        nameFlags.push({
          kind: 'undisclosed-related-inflow', tier: 'probable',
          name: info.name, tail: info.tail, count: 1, value: t.credit,
          sample: { stmtId: s.id, idx, txn: t },
          why: `Counterparty name "${info.name}" overlaps with the applicant's own registered identity, but no statement for this account was uploaded.`,
        });
        return;
      }
      // Signal (a): recurring masked account number, gated on materiality below
      if (!info.tail) return;
      if (uploadedTails.has(info.tail.slice(-6))) return; // already has a matching uploaded statement
      const key = `${s.id}:${info.tail}`;
      if (!byTail.has(key)) byTail.set(key, { count: 0, totalValue: 0, name: info.name, tail: info.tail, stmtId: s.id, sample: { stmtId: s.id, idx, txn: t } });
      const c = byTail.get(key);
      c.count++; c.totalValue += t.credit;
    });
  }

  const tailFlags = [];
  for (const c of byTail.values()) {
    const gross = grossByStmt.get(c.stmtId) || 0;
    const materialityFloor = Math.max(50000, gross * 0.005);
    if (c.count >= 3 && c.totalValue >= materialityFloor) {
      tailFlags.push({
        kind: 'undisclosed-related-inflow', tier: 'probable',
        name: c.name, tail: c.tail, count: c.count, value: c.totalValue, sample: c.sample,
        why: `Recurring inflow from account ending ${c.tail} (${c.count} occurrences, ₦${c.totalValue.toFixed(2)}) with no uploaded counterpart statement.`,
      });
    }
  }
  return [...nameFlags, ...tailFlags];
}

// In-and-out: a credit followed shortly by a debit of near-identical amount
// on the same account — classic self-funding pattern pairing can't prove
// without a counterpart statement. High tier. Deliberately tight: "near-
// identical" means within a naira or two (or 0.5%, whichever is larger),
// within the same day, and above a materiality floor — loose tolerances
// here just catch ordinary unrelated cash flow (collect a payment, pay a
// supplier a similar but unrelated amount) and drown the real signal.
function ctDetectInAndOut(appStmt, windowDays = 1, tolPct = 0.005, floor = 20000) {
  const txns = appStmt.txns.map((t, idx) => ({ ...t, idx })).sort((a, b) => a.date - b.date);
  const flags = [];
  const usedDebits = new Set();
  for (let i = 0; i < txns.length; i++) {
    const c = txns[i];
    if (!(c.credit > 0) || c.credit < floor) continue;
    for (let j = i + 1; j < txns.length; j++) {
      const d = txns[j];
      const gapDays = (d.date - c.date) / 86400000;
      if (gapDays > windowDays) break;
      if (!(d.debit > 0) || usedDebits.has(d.idx)) continue;
      const absDiff = Math.abs(d.debit - c.credit);
      const tol = Math.max(2, c.credit * tolPct);
      if (absDiff <= tol) {
        usedDebits.add(d.idx);
        flags.push({
          kind: 'in-and-out', tier: 'high', value: c.credit, gapDays,
          creditIdx: c.idx, debitIdx: d.idx,
          why: `Credit of ₦${c.credit.toFixed(2)} followed by a near-identical debit of ₦${d.debit.toFixed(2)} ${gapDays.toFixed(1)} day(s) later.`,
        });
        break;
      }
    }
  }
  return flags;
}

// Round-figure clusters: a batch of suspiciously round credits (multiples of
// ₦1,000, at or above a materiality floor) — probable tier.
function ctDetectRoundFigure(appStmt, floor = 10000) {
  const roundCredits = appStmt.txns
    .map((t, idx) => ({ ...t, idx }))
    .filter(t => t.credit > 0 && t.credit >= floor && t.credit % 1000 === 0);
  if (roundCredits.length < 3) return [];
  const totalValue = roundCredits.reduce((s, t) => s + t.credit, 0);
  return [{
    kind: 'round-figure-cluster', tier: 'probable', value: totalValue, count: roundCredits.length,
    sampleIdx: roundCredits[0].idx,
    why: `${roundCredits.length} round-figure credits (multiples of ₦1,000, ≥ ₦${floor.toLocaleString()}) totalling ₦${totalValue.toFixed(2)}.`,
  }];
}

// The turnover ladder (§6.7). Only pairs/flags touching the application
// account's own credit legs count toward internal inflow.
function ctBuildLadder(appStmt, pairs, undisclosedFlags) {
  const grossCredits = appStmt.txns.reduce((s, t) => s + (t.credit || 0), 0);

  const appPairs = pairs.filter(p => p.creditLeg.stmtId === appStmt.id);
  const confirmedInternalInflow = appPairs.filter(p => p.tier === 'confirmed').reduce((s, p) => s + p.amount, 0);
  const probableInternalInflow  = appPairs.filter(p => p.tier === 'probable').reduce((s, p) => s + p.amount, 0);

  const appUndisclosed = undisclosedFlags.filter(f => f.sample.stmtId === appStmt.id);
  const undisclosedRelatedInflow = appUndisclosed.reduce((s, f) => s + f.value, 0);

  const adjustedTurnover = grossCredits - confirmedInternalInflow;
  const conservativeExternalTurnoverFloor = grossCredits - confirmedInternalInflow - probableInternalInflow - undisclosedRelatedInflow;

  return {
    grossCredits, confirmedInternalInflow, probableInternalInflow, undisclosedRelatedInflow,
    adjustedTurnover, conservativeExternalTurnoverFloor,
  };
}

// Self-funding ratio by value, by count, and by confidence tier — the
// question each answers: "of the money that looks like turnover, how much
// is really just the applicant moving cash between their own pockets?"
function ctSelfFundingRatios(appStmt, pairs, undisclosedFlags) {
  const grossCredits = appStmt.txns.reduce((s, t) => s + (t.credit || 0), 0);
  const creditCount  = appStmt.txns.filter(t => t.credit > 0).length;

  const appPairs = pairs.filter(p => p.creditLeg.stmtId === appStmt.id);
  const confirmedPairs = appPairs.filter(p => p.tier === 'confirmed');
  const probablePairs  = appPairs.filter(p => p.tier === 'probable');
  const appUndisclosed = undisclosedFlags.filter(f => f.sample.stmtId === appStmt.id);

  const confirmedValue  = confirmedPairs.reduce((s, p) => s + p.amount, 0);
  const probableValue   = probablePairs.reduce((s, p) => s + p.amount, 0);
  const undisclosedValue = appUndisclosed.reduce((s, f) => s + f.value, 0);
  const totalFlaggedValue = confirmedValue + probableValue + undisclosedValue;
  const totalFlaggedCount = confirmedPairs.length + probablePairs.length + appUndisclosed.length;

  return {
    byValue: grossCredits > 0 ? totalFlaggedValue / grossCredits : 0,
    byCount: creditCount > 0 ? totalFlaggedCount / creditCount : 0,
    byTier: {
      confirmed:   grossCredits > 0 ? confirmedValue / grossCredits : 0,
      probable:    grossCredits > 0 ? probableValue / grossCredits : 0,
      undisclosed: grossCredits > 0 ? undisclosedValue / grossCredits : 0,
    },
    counts: { confirmed: confirmedPairs.length, probable: probablePairs.length, undisclosed: appUndisclosed.length, totalCredits: creditCount },
  };
}

function ctFlaggedCreditIdxSet(appStmt, pairs, undisclosedFlags) {
  const idx = new Set();
  pairs.filter(p => p.creditLeg.stmtId === appStmt.id).forEach(p => idx.add(p.creditLeg.idx));
  undisclosedFlags.filter(f => f.sample.stmtId === appStmt.id).forEach(f => idx.add(f.sample.idx));
  return idx;
}

// Monthly self-funding trend on the application account.
function ctMonthlyTrend(appStmt, pairs, undisclosedFlags) {
  const flagged = ctFlaggedCreditIdxSet(appStmt, pairs, undisclosedFlags);
  const months = new Map();
  appStmt.txns.forEach((t, idx) => {
    if (!(t.credit > 0)) return;
    const key = `${t.date.getFullYear()}-${String(t.date.getMonth() + 1).padStart(2, '0')}`;
    if (!months.has(key)) months.set(key, { gross: 0, flaggedVal: 0 });
    const m = months.get(key);
    m.gross += t.credit;
    if (flagged.has(idx)) m.flaggedVal += t.credit;
  });
  return [...months.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1)
    .map(([month, v]) => ({ month, gross: v.gross, flagged: v.flaggedVal, ratio: v.gross > 0 ? v.flaggedVal / v.gross : 0 }));
}

// Pre-application window vs the rest of the period — turnover-pumping ahead
// of a loan application is the classic pattern this comparison surfaces.
function ctPreAppComparison(appStmt, pairs, undisclosedFlags, appDateStr, windowDays = 90) {
  if (!appDateStr) return null;
  const appDate = new Date(appDateStr);
  if (isNaN(appDate.getTime())) return null;
  const windowStart = new Date(appDate.getTime() - windowDays * 86400000);
  const flagged = ctFlaggedCreditIdxSet(appStmt, pairs, undisclosedFlags);

  let preGross = 0, preFlagged = 0, restGross = 0, restFlagged = 0;
  appStmt.txns.forEach((t, idx) => {
    if (!(t.credit > 0)) return;
    const inWindow = t.date >= windowStart && t.date <= appDate;
    if (inWindow) { preGross += t.credit; if (flagged.has(idx)) preFlagged += t.credit; }
    else          { restGross += t.credit; if (flagged.has(idx)) restFlagged += t.credit; }
  });
  return {
    windowDays, appDate: appDateStr,
    preApplication: { gross: preGross, flagged: preFlagged, ratio: preGross > 0 ? preFlagged / preGross : 0 },
    restOfPeriod:   { gross: restGross, flagged: restFlagged, ratio: restGross > 0 ? restFlagged / restGross : 0 },
  };
}


// ── CrediTrace: Analysis page (Checkpoint 3) ────────────────────────
function ctBuildAnalysis() {
  const appStmt = ct.statements.find(s => s.id === ct.appAccountId && s.status === 'ok');
  if (!appStmt) return null;

  const reconciled = ct.statements.filter(s => s.status === 'ok');
  const pairs = ctPairTransfers(reconciled);
  const pairedCreditKeys = new Set(pairs.map(p => `${p.creditLeg.stmtId}:${p.creditLeg.idx}`));
  const undisclosed = ctDetectUndisclosed(reconciled, pairedCreditKeys);
  const inAndOut = ctDetectInAndOut(appStmt);
  const roundFig = ctDetectRoundFigure(appStmt);

  // Stable ids for the workbench — pairs already carry one from ctPairTransfers.
  undisclosed.forEach(f => { f.id = `undisc_${f.sample.stmtId}_${f.sample.idx}`; });
  inAndOut.forEach(f => { f.id = `inout_${f.creditIdx}_${f.debitIdx}`; });
  roundFig.forEach(f => { f.id = `roundfig_${f.sampleIdx}`; });

  const ladder = ctBuildLadderWithDecisions(appStmt, pairs, undisclosed, inAndOut, roundFig, ct.decisions);
  const ratios = ctSelfFundingRatios(appStmt, pairs, undisclosed);
  const monthly = ctMonthlyTrend(appStmt, pairs, undisclosed);
  const preApp = ctPreAppComparison(appStmt, pairs, undisclosed, ct.appDate, 90);

  return { appStmt, reconciled, pairs, undisclosed, inAndOut, roundFig, ladder, ratios, monthly, preApp };
}

// Decision-aware turnover ladder. Default tier-based treatment applies
// (confirmed/probable pairs and undisclosed flags count; behavioural flags
// don't) — an explicit analyst verdict overrides that default in either
// direction: 'dismissed' removes a default-included item, 'upheld' adds a
// default-excluded one (behavioural flags only).
function ctBuildLadderWithDecisions(appStmt, pairs, undisclosedFlags, inAndOut, roundFig, decisions) {
  const verdict = id => (decisions[id] && decisions[id].verdict) || 'pending';
  const grossCredits = appStmt.txns.reduce((s, t) => s + (t.credit || 0), 0);

  const appPairs = pairs.filter(p => p.creditLeg.stmtId === appStmt.id);
  const confirmedPairs = appPairs.filter(p => p.tier === 'confirmed' && verdict(p.id) !== 'dismissed');
  const probablePairs  = appPairs.filter(p => p.tier === 'probable'  && verdict(p.id) !== 'dismissed');
  const appUndisclosed = undisclosedFlags.filter(f => f.sample.stmtId === appStmt.id && verdict(f.id) !== 'dismissed');
  const upheldInAndOut = inAndOut.filter(f => verdict(f.id) === 'upheld');
  const upheldRoundFig = roundFig.filter(f => verdict(f.id) === 'upheld');

  const confirmedInternalInflow = confirmedPairs.reduce((s, p) => s + p.amount, 0);
  const undisclosedRelatedInflow = appUndisclosed.reduce((s, f) => s + f.value, 0);
  const probableInternalInflow =
    probablePairs.reduce((s, p) => s + p.amount, 0) +
    upheldInAndOut.reduce((s, f) => s + f.value, 0) +
    upheldRoundFig.reduce((s, f) => s + f.value, 0);

  const adjustedTurnover = grossCredits - confirmedInternalInflow;
  const conservativeExternalTurnoverFloor = grossCredits - confirmedInternalInflow - probableInternalInflow - undisclosedRelatedInflow;

  return {
    grossCredits, confirmedInternalInflow, probableInternalInflow, undisclosedRelatedInflow,
    adjustedTurnover, conservativeExternalTurnoverFloor,
  };
}

// ── CrediTrace: Workbench page (Checkpoint 4) ───────────────────────
let ctWb = { statusFilter: 'all', tierFilter: 'all', expandedId: null };

function ctTxnAt(stmtId, idx) {
  const s = ct.statements.find(x => x.id === stmtId);
  return s ? s.txns[idx] : null;
}
function ctBankName(stmtId) {
  const s = ct.statements.find(x => x.id === stmtId);
  return s ? (FNAMES[s.fmt] || s.fmt) : '—';
}

// Every pair and flag touching the application account, as one flat,
// materiality-ranked list — the workbench doesn't distinguish pairs from
// flags in the list itself, only in how each row's detail renders.
function ctWorkbenchItems(a) {
  const items = [];
  a.pairs.forEach(p => {
    if (p.creditLeg.stmtId !== a.appStmt.id && p.debitLeg.stmtId !== a.appStmt.id) return;
    items.push({ id: p.id, kind: 'pair', tier: p.tier, value: p.amount, pair: p });
  });
  a.undisclosed.forEach(f => {
    if (f.sample.stmtId !== a.appStmt.id) return;
    items.push({ id: f.id, kind: 'undisclosed', tier: f.tier, value: f.value, flag: f });
  });
  a.inAndOut.forEach(f => items.push({ id: f.id, kind: 'in-and-out', tier: f.tier, value: f.value, flag: f }));
  a.roundFig.forEach(f => items.push({ id: f.id, kind: 'round-figure', tier: f.tier, value: f.value, flag: f }));
  items.sort((x, y) => y.value - x.value);
  return items;
}

function ctWbKindLabel(kind) {
  return { pair: 'Transfer pair', undisclosed: 'Undisclosed related inflow',
    'in-and-out': 'In-and-out pattern', 'round-figure': 'Round-figure cluster' }[kind] || kind;
}

function renderWorkbench() {
  if (!ct.appAccountId) {
    return `<div class="ct-page"><div class="pg-eyebrow">CrediTrace workbench</div><div class="pg-title">Nothing to review yet.</div><div class="pg-sub">Set an application account on the Case tab first.</div></div>`;
  }
  const a = ctBuildAnalysis();
  if (!a) return `<div class="ct-page"><div class="pg-sub">Application account not found.</div></div>`;

  const allItems = ctWorkbenchItems(a);
  let items = allItems;
  if (ctWb.statusFilter !== 'all') items = items.filter(it => ctVerdict(it.id) === ctWb.statusFilter);
  if (ctWb.tierFilter !== 'all') items = items.filter(it => it.tier === ctWb.tierFilter);

  const l = a.ladder;
  const summaryHtml = `
    <div class="ct-wb-summary">
      <div class="ct-wb-summary-item"><div class="ct-wb-val">${ctN(l.grossCredits)}</div><div class="ct-wb-lbl">Gross credits</div></div>
      <div class="ct-wb-summary-item"><div class="ct-wb-val">${ctN(l.adjustedTurnover)}</div><div class="ct-wb-lbl">Adjusted turnover</div></div>
      <div class="ct-wb-summary-item"><div class="ct-wb-val">${ctN(l.conservativeExternalTurnoverFloor)}</div><div class="ct-wb-lbl">External floor</div></div>
      <div class="ct-wb-summary-item"><div class="ct-wb-val">${allItems.length}</div><div class="ct-wb-lbl">Total items</div></div>
    </div>`;

  const filterBtn = (group, val, label) =>
    `<button class="ct-wb-filter-btn ${ctWb[group]===val?'active':''}" data-filter-group="${group}" data-filter-val="${val}">${label}</button>`;

  const rowsHtml = items.length ? items.map(it => ctWbRow(it, a)).join('')
    : `<div class="ct-empty-note">No items match the current filters.</div>`;

  return `
    <div class="ct-page">
      <div class="pg-eyebrow">CrediTrace workbench</div>
      <div class="pg-title">Drill down, decide, done.</div>
      <div class="pg-sub">Every pair and flag touching the application account, ranked by materiality. Uphold what's real self-funding, dismiss what isn't — the ladder above updates live as you decide.</div>
      ${summaryHtml}
      <div class="ct-wb-filters" style="justify-content:space-between">
        <div style="display:flex;gap:8px;flex-wrap:wrap">${filterBtn('statusFilter','all','All statuses')}${filterBtn('statusFilter','pending','Pending')}${filterBtn('statusFilter','upheld','Upheld')}${filterBtn('statusFilter','dismissed','Dismissed')}</div>
        <button class="ct-wb-btn" id="dlMemoXLSX" style="border-color:var(--accent);color:var(--accent);font-weight:560">Download credit memo annex</button>
      </div>
      <div class="ct-wb-filters">
        ${filterBtn('tierFilter','all','All tiers')}
        ${filterBtn('tierFilter','confirmed','Confirmed')}
        ${filterBtn('tierFilter','probable','Probable')}
        ${filterBtn('tierFilter','high','High')}
      </div>
      <div class="ct-wb-list">${rowsHtml}</div>
    </div>`;
}

function ctWbRow(it, a) {
  const verdict = ctVerdict(it.id);
  const note = ctNote(it.id);
  const expanded = ctWb.expandedId === it.id;
  const dismissedCls = verdict === 'dismissed' ? 'ct-wb-dismissed' : '';
  const badge = `<span class="ct-wb-verdict-badge ${verdict}">${verdict}</span>`;

  let bodyHtml = '';
  if (expanded) {
    let legsHtml = '', whyHtml = '';
    if (it.kind === 'pair') {
      const p = it.pair;
      legsHtml = `
        <div class="ct-wb-legs">
          <div class="ct-wb-leg"><div class="ct-wb-leg-hdr">Debit leg · ${esc(ctBankName(p.debitLeg.stmtId))}</div><div class="ct-wb-leg-narr">${esc(p.debitLeg.txn.narration||'')}<br>${ctN(p.debitLeg.txn.debit)} · ${p.debitLeg.txn.date.toLocaleDateString()}</div></div>
          <div class="ct-wb-leg"><div class="ct-wb-leg-hdr">Credit leg · ${esc(ctBankName(p.creditLeg.stmtId))}</div><div class="ct-wb-leg-narr">${esc(p.creditLeg.txn.narration||'')}<br>${ctN(p.creditLeg.txn.credit)} · ${p.creditLeg.txn.date.toLocaleDateString()}</div></div>
        </div>`;
      whyHtml = `<div class="ct-wb-why">Matched on amount + ${p.tier==='confirmed'?'account reference':'name'}, ${p.dayGap.toFixed(1)} day(s) apart.</div>`;
    } else if (it.kind === 'undisclosed') {
      const f = it.flag, txn = f.sample.txn;
      legsHtml = `<div class="ct-wb-legs"><div class="ct-wb-leg" style="grid-column:1/-1"><div class="ct-wb-leg-hdr">Credit · ${esc(ctBankName(f.sample.stmtId))}</div><div class="ct-wb-leg-narr">${esc(txn.narration||'')}<br>${ctN(txn.credit)} · ${txn.date.toLocaleDateString()}</div></div></div>`;
      whyHtml = `<div class="ct-wb-why">${esc(f.why)}</div>`;
    } else if (it.kind === 'in-and-out') {
      const f = it.flag, c = a.appStmt.txns[f.creditIdx], d = a.appStmt.txns[f.debitIdx];
      legsHtml = `
        <div class="ct-wb-legs">
          <div class="ct-wb-leg"><div class="ct-wb-leg-hdr">Credit leg</div><div class="ct-wb-leg-narr">${esc(c?c.narration:'')}<br>${ctN(c?c.credit:0)} · ${c?c.date.toLocaleDateString():''}</div></div>
          <div class="ct-wb-leg"><div class="ct-wb-leg-hdr">Debit leg</div><div class="ct-wb-leg-narr">${esc(d?d.narration:'')}<br>${ctN(d?d.debit:0)} · ${d?d.date.toLocaleDateString():''}</div></div>
        </div>`;
      whyHtml = `<div class="ct-wb-why">${esc(f.why)}</div>`;
    } else if (it.kind === 'round-figure') {
      const f = it.flag, txn = a.appStmt.txns[f.sampleIdx];
      legsHtml = `<div class="ct-wb-legs"><div class="ct-wb-leg" style="grid-column:1/-1"><div class="ct-wb-leg-hdr">Sample transaction</div><div class="ct-wb-leg-narr">${esc(txn?txn.narration:'')}<br>${ctN(txn?txn.credit:0)} · ${txn?txn.date.toLocaleDateString():''}</div></div></div>`;
      whyHtml = `<div class="ct-wb-why">${esc(f.why)}</div>`;
    }

    bodyHtml = `
      <div class="ct-wb-row-body">
        ${legsHtml}
        ${whyHtml}
        <div class="ct-wb-actions">
          <button class="ct-wb-btn uphold ${verdict==='upheld'?'active':''}" data-verdict-id="${it.id}" data-verdict-val="upheld">Uphold flag</button>
          <button class="ct-wb-btn dismiss ${verdict==='dismissed'?'active':''}" data-verdict-id="${it.id}" data-verdict-val="dismissed">Dismiss</button>
          ${verdict!=='pending' ? `<button class="ct-wb-btn" data-verdict-id="${it.id}" data-verdict-val="pending">Reset</button>` : ''}
        </div>
        <textarea class="ct-wb-note" placeholder="Analyst note (optional)" data-note-id="${it.id}">${esc(note)}</textarea>
      </div>`;
  }

  return `
    <div class="ct-wb-row ${dismissedCls}">
      <div class="ct-wb-row-head" data-expand-id="${it.id}">
        <span class="ct-tier-tag ${it.tier}">${it.tier}</span>
        <span class="ct-wb-row-kind"><b>${ctWbKindLabel(it.kind)}</b></span>
        <span class="ct-wb-row-amt">${ctN(it.value)}</span>
        ${badge}
      </div>
      ${bodyHtml}
    </div>`;
}

// ── Page: Overview ───────────────────────────────────────────────
// ── Monthly Breakdown Table ───────────────────────────────────────
function renderOverviewMonthly(monthly, totalCr, totalDr) {
  const totNet = totalCr - totalDr;
  const rows = monthly.map((m, i) => {
    const net = m.net;
    const netCls = net >= 0 ? 'g' : 'r';
    const prev = i > 0 ? monthly[i-1] : null;
    const crMom = prev && prev.cr > 0 ? ((m.cr - prev.cr) / prev.cr * 100) : null;
    const drMom = prev && prev.dr > 0 ? ((m.dr - prev.dr) / prev.dr * 100) : null;
    const crMomStr = crMom !== null ? `<span style="font-size:10px;color:${crMom>=0?'var(--green)':'var(--red)'}">${crMom>=0?'▲':'▼'}${Math.abs(crMom).toFixed(0)}%</span>` : '';
    const drMomStr = drMom !== null ? `<span style="font-size:10px;color:${drMom<=0?'var(--green)':'var(--red)'}">${drMom<=0?'▼':'▲'}${Math.abs(drMom).toFixed(0)}%</span>` : '';
    return `<tr>
      <td class="mt-lbl">${m.label}${i===0||i===monthly.length-1?'<span class="partial-tag">*</span>':''}</td>
      <td class="mt-num g">₦${fmtN(m.cr)} ${crMomStr}</td>
      <td class="mt-cnt">${m.crN}</td>
      <td class="mt-num r">₦${fmtN(m.dr)} ${drMomStr}</td>
      <td class="mt-cnt">${m.drN}</td>
      <td class="mt-num ${netCls}">${net>=0?'+':''}₦${fmtN(Math.abs(net))}</td>
      <td class="mt-cnt">${m.crN+m.drN}</td>
    </tr>`;
  }).join('');

  return `<div class="sbox" style="margin-bottom:20px">
    <div class="sbox-hdr">
      <div class="sbox-title">Monthly breakdown</div>
      <div class="sbox-meta">* partial month</div>
    </div>
    <div style="overflow-x:auto">
    <table class="mt">
      <thead><tr>
        <th class="mt-lbl">Month</th>
        <th class="mt-num">Total Credits (₦)</th>
        <th class="mt-cnt">Cr</th>
        <th class="mt-num">Total Debits (₦)</th>
        <th class="mt-cnt">Dr</th>
        <th class="mt-num">Net Flow (₦)</th>
        <th class="mt-cnt">Txns</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td class="mt-lbl" style="font-weight:600">TOTAL</td>
        <td class="mt-num g" style="font-weight:600">₦${fmtN(totalCr)}</td>
        <td class="mt-cnt" style="font-weight:600">${monthly.reduce((s,m)=>s+m.crN,0)}</td>
        <td class="mt-num r" style="font-weight:600">₦${fmtN(totalDr)}</td>
        <td class="mt-cnt" style="font-weight:600">${monthly.reduce((s,m)=>s+m.drN,0)}</td>
        <td class="mt-num ${totNet>=0?'g':'r'}" style="font-weight:600">${totNet>=0?'+':''}₦${fmtN(Math.abs(totNet))}</td>
        <td class="mt-cnt" style="font-weight:600">${monthly.reduce((s,m)=>s+m.crN+m.drN,0)}</td>
      </tr></tfoot>
    </table>
    </div>
  </div>`;
}

// ── Page: Transactions ────────────────────────────────────────────
let txnView='individual', txnFilter='All', txnSearch='';

function renderTransactions() {
  const { txns, monthly } = state;
  const cats = ['All', ...new Set(txns.map(t=>t.cat))].sort();

  return `
    <div class="pg-eyebrow">Activity</div>
    <div class="pg-title">Transactions</div>
    <div class="pg-sub">${txns.length.toLocaleString()} transactions across ${monthly.length} months.</div>

    <div class="view-toggle">
      <button class="vtbtn ${txnView==='individual'?'active':''}" id="vtInd">Individual</button>
      <button class="vtbtn ${txnView==='monthly'?'active':''}" id="vtMon">Monthly</button>
    </div>

    <div id="txnContent">
      ${txnView==='individual' ? renderIndividualTxns(txns, cats) : renderMonthlyTable(monthly)}
    </div>`;
}

function renderIndividualTxns(txns, cats) {
  const filtered = txns
    .filter(t => txnFilter==='All' || t.cat===txnFilter)
    .filter(t => !txnSearch || t.narration.toLowerCase().includes(txnSearch.toLowerCase()))
    .sort((a,b)=>b.date-a.date);

  // Group by date
  const groups = {};
  for (const t of filtered) {
    const k = t.date.toISOString().slice(0,10);
    if (!groups[k]) groups[k]={ date:t.date, txns:[], total:0 };
    groups[k].txns.push(t);
    groups[k].total += t.credit - t.debit;
  }

  return `
    <div class="filter-bar">
      ${cats.map(c=>`<button class="fbtn ${txnFilter===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}
    </div>
    <div class="search-wrap">
      <svg class="search-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Search narrations…" id="txnSearchInp" value="${esc(txnSearch)}">
    </div>
    <div class="sbox">
      ${Object.values(groups).length===0
        ? `<div style="padding:28px;text-align:center;color:var(--dim);font-size:13px">No transactions match your filter.</div>`
        : Object.values(groups).map(g=>`
          <div class="txn-date-hdr">
            <span>${fmtDate(g.date)}</span>
            <span class="${g.total>=0?'np':'nn'}">${g.total<0?'-':''}₦${fmtN(Math.abs(g.total))}</span>
          </div>
          ${g.txns.map(t=>txnRow(t)).join('')}
        `).join('')
      }
    </div>`;
}

function renderMonthlyTable(monthly) {
  const keys = monthly.map(m=>m.key);
  const isPart = k => k===keys[0]||k===keys[keys.length-1];
  const totCr=monthly.reduce((s,m)=>s+m.cr,0), totDr=monthly.reduce((s,m)=>s+m.dr,0);
  const totCrN=monthly.reduce((s,m)=>s+m.crN,0), totDrN=monthly.reduce((s,m)=>s+m.drN,0);
  const totNet=totCr-totDr;

  return `
    <div class="sbox">
      <div class="sbox-hdr">
        <div class="sbox-title">Monthly Summary</div>
        <span class="sbox-meta">${monthly.length} months</span>
      </div>
      <div class="tscroll">
        <table>
          <thead><tr>
            <th style="text-align:left">Month</th>
            <th>Credits (₦)</th><th>Cr Txns</th>
            <th>Debits (₦)</th><th>Dr Txns</th>
            <th>Net Flow (₦)</th>
            <th>Largest Credit</th><th>Largest Debit</th>
          </tr></thead>
          <tbody>
          ${monthly.map(m=>{
            const nc=m.net>0.01?'np':m.net<-0.01?'nn':'nz';
            return `<tr class="${isPart(m.key)?'part':''}">
              <td>${m.label}${isPart(m.key)?' *':''}</td>
              <td class="cr">${fmtN(m.cr)}</td><td class="cnt">${m.crN}</td>
              <td class="dr">${fmtN(m.dr)}</td><td class="cnt">${m.drN}</td>
              <td class="${nc}">${m.net<0?'-':''}${fmtN(Math.abs(m.net))}</td>
              <td>${fmtN(m.crMax)}</td><td>${fmtN(m.drMax)}</td>
            </tr>`;
          }).join('')}
          </tbody>
          <tfoot><tr>
            <td>TOTAL</td>
            <td>${fmtN(totCr)}</td><td>${totCrN}</td>
            <td>${fmtN(totDr)}</td><td>${totDrN}</td>
            <td class="${totNet>0?'np':totNet<0?'nn':'nz'}">${totNet<0?'-':''}${fmtN(Math.abs(totNet))}</td>
            <td>—</td><td>—</td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
}

function txnRow(t) {
  const cfg = CAT_CFG[t.cat]||CAT_CFG.Other;
  const av  = avatarText(t.narration);
  const isCredit = t.credit > 0;
  const amt = isCredit ? t.credit : t.debit;
  return `<div class="txn-row">
    <div class="txn-avatar" style="background:${cfg.bg};color:${cfg.color}">${av}</div>
    <div class="txn-body">
      <div class="txn-name">${esc(t.narration)||'Transaction'}</div>
      <div class="txn-meta">${fmtDate(t.date)}</div>
    </div>
    <div class="txn-right">
      <div class="txn-amount ${isCredit?'cr':'dr'}">${isCredit?'+':'-'}₦${fmtN(amt)}</div>
      <div class="txn-cat">${t.cat}</div>
    </div>
  </div>`;
}

        : '<div style="padding:16px 18px;font-size:12px;color:var(--dim)">No charges found recurring across 3 or more months.</div>'}
    </div>

    <div class="quote-block">
      <div class="quote-text">"Money flows toward clarity and away from confusion."</div>
      <div class="quote-attr">— financial intelligence proverb</div>
    </div>`;
}

// ── Chart renderer ────────────────────────────────────────────────
function renderBarChart(monthly) {
  const data  = monthly.slice(-6);
  if (!data.length) return '<div style="height:120px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px">No data</div>';
  const maxVal = Math.max(...data.map(m=>Math.max(m.cr,m.dr)), 1);
  const chartH = 110, barW = 16, gap = 6, groupW = barW*2+gap, groupGap = 24;
  const totalW = data.length*(groupW+groupGap);

  const bars = data.map((m,i)=>{
    const x    = i*(groupW+groupGap);
    const crH  = Math.round((m.cr/maxVal)*chartH);
    const drH  = Math.round((m.dr/maxVal)*chartH);
    const lbl  = m.label.split(' ')[0];
    return `<g transform="translate(${x},0)">
      <rect x="0" y="${chartH-crH}" width="${barW}" height="${crH}" fill="var(--accent)" rx="2" opacity=".85"/>
      <rect x="${barW+gap}" y="${chartH-drH}" width="${barW}" height="${drH}" fill="var(--chart-dr)" rx="2"/>
      <text x="${groupW/2}" y="${chartH+16}" text-anchor="middle"
        font-size="10" fill="var(--dim)" font-family="IBM Plex Sans">${lbl}</text>
    </g>`;
  }).join('');

  return `<svg viewBox="0 0 ${totalW} ${chartH+28}" xmlns="http://www.w3.org/2000/svg"
    style="width:100%;height:auto;overflow:visible;display:block">${bars}</svg>`;
}

// ── Category breakdown ────────────────────────────────────────────
function renderCatBreakdown(catMap) {
  const total = Object.values(catMap).reduce((s,v)=>s+v,0);
  if (!total) return '<div style="font-size:12px;color:var(--dim)">No spending data.</div>';
  return Object.entries(catMap)
    .sort(([,a],[,b])=>b-a).slice(0,6)
    .map(([cat,amt])=>{
      const pct = Math.round(amt/total*100);
      const cfg = CAT_CFG[cat]||CAT_CFG.Other;
      return `<div class="cat-row">
        <div class="cat-name">${cat}</div>
        <div class="cat-track"><div class="cat-fill" style="width:${pct}%;background:${cfg.color};opacity:.7"></div></div>
        <div class="cat-amt">₦${fmtN(amt)}</div>
      </div>`;
    }).join('');
}

  ws1.addRow([]);

  ladderHdr.eachCell({ includeEmpty: true }, c => { c.fill = fill('1F3864'); c.font = font('FFFFFF', 10, true); c.alignment = alignL(); });
  const l = a.ladder;

    ['− Confirmed internal inflow', '', l.confirmedInternalInflow],
    ['= Adjusted turnover', '', l.adjustedTurnover],
    ['− Probable internal inflow', '', l.probableInternalInflow],
    ['− Undisclosed-related inflow', '', l.undisclosedRelatedInflow],
    ['= Conservative external turnover floor', '', l.conservativeExternalTurnoverFloor],

  const items = ctWorkbenchItems(a);
  items.forEach((it, ri) => {
    const verdict = ctVerdict(it.id);

    let desc = '';

      desc = `${ctBankName(it.pair.debitLeg.stmtId)} → ${ctBankName(it.pair.creditLeg.stmtId)}, ${it.pair.dayGap.toFixed(1)}d gap`;
    } else if (it.flag) desc = it.flag.why;

    const row = ws2.addRow([ctWbKindLabel(it.kind), it.tier, it.value, desc, verdict, note]);

      isOk ? (s.checks && s.checks.recon ? s.checks.recon.note : '') : (s.error || ''),

    row.eachCell({ includeEmpty: true }, (c, col) => applyStyle(c, {
      fill: fill(ev ? 'FFFFFF' : 'F4F3EF'),
      font: col === 6 ? font(statusColor, 9, true) : font('1A1916', 9),
      alignment: col === 5 ? alignR() : alignL(col === 7),
      border: bdrA(bdrT),
    }));
  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const dl = document.createElement('a');
  dl.href = url;
  dl.download = `${(a.appStmt.cs.acctName || a.appStmt.fname).replace(/[^a-zA-Z0-9]/g,'_').replace(/_+/g,'_')}_CrediTrace_Memo.xlsx`;
  document.body.appendChild(dl); dl.click(); document.body.removeChild(dl);
  URL.revokeObjectURL(url);

function applyStyle(cell, opts) {
  if (opts.fill) cell.fill = opts.fill;
  if (opts.font) cell.font = opts.font;
  if (opts.alignment) cell.alignment = opts.alignment;
  if (opts.border) cell.border = opts.border;
  if (opts.numFmt) cell.numFmt = opts.numFmt;
}

async function dlXLSX() {

  if(btn) btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke-linecap="round" stroke-linejoin="round"/></svg> Download Excel';
}

// ── CSV Export ────────────────────────────────────────────────────
function dlCSV() {
  const { fmt, cs, monthly, fname, checks } = state;
  const keys=monthly.map(m=>m.key);
  const isPart=k=>k===keys[0]||k===keys[keys.length-1];
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;

  const rows=[['Month','Total Credits (NGN)','Cr Count','Total Debits (NGN)','Dr Count','Net Flow (NGN)','Largest Credit (NGN)','Largest Debit (NGN)','Notes'].map(q).join(',')];
  for (const m of monthly) {
    rows.push([m.label+(isPart(m.key)?' *':''),m.cr.toFixed(2),m.crN,m.dr.toFixed(2),m.drN,m.net.toFixed(2),m.crMax.toFixed(2),m.drMax.toFixed(2),isPart(m.key)?'Partial month':''].map(q).join(','));
  }
  const totCr=monthly.reduce((s,m)=>s+m.cr,0), totDr=monthly.reduce((s,m)=>s+m.dr,0);
  const totCrN=monthly.reduce((s,m)=>s+m.crN,0), totDrN=monthly.reduce((s,m)=>s+m.drN,0);
  rows.push(['TOTAL',totCr.toFixed(2),totCrN,totDr.toFixed(2),totDrN,(totCr-totDr).toFixed(2),'','',`Recon: ${checks.recon.pass?'PASS':'FAIL'} | ${FNAMES[fmt]||fmt}`].map(q).join(','));

  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`${(cs.acctName||fname).replace(/[^a-zA-Z0-9]/g,'_')}_Monthly_Summary.csv`;
  a.click(); URL.revokeObjectURL(url);
}


// ── Credit Analysis Engine ────────────────────────────────────────

const BETTING_PAT = /BET9JA|SPORTYBET|SPORTBET|1XBET|BETWAY|NAIRABET|BETNAIJA|BETKING|PARIMATCH|CLOUDBET|MSPORT|SUPABETS|BANGBET|ACCESSBET|\bBET\b|\bSTAKE\b|\bBETTING\b|\bGAMBL/i;
const ATM_PAT     = /\bATM\b|CASH\s*WITH|WITHDRAWAL|ATM\s*TRF|AUTOMATED\s*TELLER/i;
const LOAN_PAT    = /LOAN\s*REPAY|LOAN\s*DEDUCT|EMI\s*PAYMENT|CREDIT\s*REPAY|CREDIT\s*DEDUCT|LOAN\s*RECOVERY|OVERDUE\s*REPAY|LOAN\s*REDUC|REPAYMENT|AUTO\s*DEBIT.*LOAN|DEBIT.*LOAN/i;
const SALARY_PAT  = /SALARY|PAYROLL|STIPEND|PAYSTUB|\bWAGE\b|REMUNERATION|STAFF\s*PAY/i;
const WEB_PAT     = /WEB\s*PUR|ONLINE\s*PUR|E-COMMERCE|PAYSTACK|FLUTTERWAVE|PAYPAL|STRIPE|AMAZON|ALIEXPRESS|JUMIA|KONGA|SELAR|GUMROAD|SHOPIFY/i;
const SUPERMARKET_PAT = /SHOPRITE|SPAR|MARKET\s*SQUARE|GAME\s*STORE|PARK\s*N\s*SHOP|JUSTRITE|PRINCE\s*EBEANO|GROCERY|SUPERMARKET|HYPERMARKET/i;
const POS_PAT     = /\bPOS\b|\bPOS\s*TRF\b|POINT\s*OF\s*SALE/i;
const INTL_PAT    = /FOREIGN\s*CURR|FCY|USD|GBP|EUR|DOMICIL|\$\s*\d|£\s*\d|€\s*\d/i;
const SAVINGS_PAT = /PIGGYBANK|PIGGY\s*VEST|COWRYWISE|CASHBOX|OWEALTH|BAMBOO|RISEVEST|CARBON\s*SAVE|KUDA\s*SAVE/i;

function computeCreditProfile(txns, monthly, cs) {
  const totalCr = txns.reduce((s,t)=>s+t.credit,0);
  const totalDr = txns.reduce((s,t)=>s+t.debit,0);
  const avgMonthlyIncome = totalCr / (monthly.length||1);

  // ── Segment transactions ──────────────────────────────────────
  const betting    = txns.filter(t=>t.debit>0 && BETTING_PAT.test(t.narration));
  const atm        = txns.filter(t=>t.debit>0 && ATM_PAT.test(t.narration));
  const loans      = txns.filter(t=>t.debit>0 && LOAN_PAT.test(t.narration));
  const salaryIn   = txns.filter(t=>t.credit>0 && SALARY_PAT.test(t.narration));
  const webPurch   = txns.filter(t=>t.debit>0 && WEB_PAT.test(t.narration));
  const supermarket= txns.filter(t=>t.debit>0 && SUPERMARKET_PAT.test(t.narration));
  const pos        = txns.filter(t=>t.debit>0 && POS_PAT.test(t.narration) && !ATM_PAT.test(t.narration));
  const intl       = txns.filter(t=>t.debit>0 && INTL_PAT.test(t.narration));
  const savings    = txns.filter(t=>SAVINGS_PAT.test(t.narration));

  const sum = arr => arr.reduce((s,t)=>s+(t.debit||t.credit),0);

  // ── Salary regularity ─────────────────────────────────────────
  const salaryMonths = new Set(salaryIn.map(t=>mkKey(t.date)));
  const salaryPresent = salaryMonths.size;
  const salaryRegular = salaryIn.length > 0;
  const salaryAmounts = salaryIn.map(t=>t.credit);
  const salaryAvg = salaryAmounts.length ? salaryAmounts.reduce((s,v)=>s+v,0)/salaryAmounts.length : 0;
  const salaryVariance = salaryAmounts.length > 1 ?
    Math.sqrt(salaryAmounts.reduce((s,v)=>s+Math.pow(v-salaryAvg,2),0)/salaryAmounts.length)/salaryAvg : 0;

  // ── Income months (any credit month) ─────────────────────────
  const incomeMonths = new Set(txns.filter(t=>t.credit>0).map(t=>mkKey(t.date)));
  const incomeCoverage = Math.round(incomeMonths.size/monthly.length*100);

  // ── Cashflow consistency score (CV of monthly net) ────────────
  const nets = monthly.map(m=>m.cr-m.dr);
  const netAvg = nets.reduce((s,v)=>s+v,0)/(nets.length||1);
  const netCV  = nets.length>1 ?
    Math.sqrt(nets.reduce((s,v)=>s+Math.pow(v-netAvg,2),0)/nets.length)/Math.abs(netAvg||1) : 0;
  const consistencyScore = Math.max(0, Math.round(100 - Math.min(netCV*100,100)));

  // ── Major single debits (>10% of avg monthly income) ─────────
  const majorThreshold = avgMonthlyIncome * 0.10;
  const majorDebits = txns
    .filter(t=>t.debit>majorThreshold && !LOAN_PAT.test(t.narration))
    .sort((a,b)=>b.debit-a.debit).slice(0,10);

  // ── Compute flags ─────────────────────────────────────────────
  const flags = [];
  const bettingTotal = sum(betting);
  const atmTotal     = sum(atm);
  const loanTotal    = sum(loans);
  const bettingPct   = avgMonthlyIncome>0 ? Math.round(bettingTotal/avgMonthlyIncome*100) : 0;
  const atmPct       = totalDr>0 ? Math.round(atmTotal/totalDr*100) : 0;
  const loanMonthly  = loanTotal/(monthly.length||1);

  if (betting.length>0) flags.push({
    sev:'critical', title:'Gambling / Betting Detected',
    note:`${betting.length} betting transactions totalling ₦${fmtN(bettingTotal)} — ${bettingPct}% of average monthly income.`,
    amount:bettingTotal, amtCls:'r',
  });

  if (atmPct>35) flags.push({
    sev:'warning', title:'High Cash Withdrawal Ratio',
    note:`ATM withdrawals account for ${atmPct}% of total debits (₦${fmtN(atmTotal)}). Cash-heavy behaviour reduces spend traceability.`,
    amount:atmTotal, amtCls:'a',
  });

  if (loans.length>0) flags.push({
    sev:'critical', title:'Undisclosed Loan Repayments',
    note:`${loans.length} loan repayment entries detected. Monthly obligation approximately ₦${fmtN(loanMonthly)}. Verify if disclosed on application.`,
    amount:loanTotal, amtCls:'r',
  });

  if (salaryRegular && salaryPresent < monthly.length * 0.7) flags.push({
    sev:'warning', title:'Inconsistent Salary Credits',
    note:`Salary found in only ${salaryPresent} of ${monthly.length} months. Income reliability risk — verify employment status.`,
    amount:salaryAvg, amtCls:'a',
  });

  if (incomeCoverage < 80) flags.push({
    sev:'warning', title:'Income Gaps Detected',
    note:`Credits recorded in only ${incomeCoverage}% of statement months. ${monthly.length - incomeMonths.size} months had zero credit entries.`,
    amount:0, amtCls:'a',
  });

  if (intl.length>0) flags.push({
    sev:'info', title:'Foreign Currency Transactions',
    note:`${intl.length} international/FCY purchase(s) detected. Indicates potential dollar-denominated exposure.`,
    amount:sum(intl), amtCls:'a',
  });

  if (savings.length>0) flags.push({
    sev:'info', title:'Active Savings Behaviour',
    note:`${savings.length} savings platform transaction(s) — ${SAVINGS_PAT.source.replace(/[\\\|]/g,', ').slice(0,60)}…`,
    amount:sum(savings), amtCls:'g',
  });

  // ── Overall risk level ────────────────────────────────────────
  const criticals = flags.filter(f=>f.sev==='critical').length;
  const warnings  = flags.filter(f=>f.sev==='warning').length;
  const riskLevel = criticals>=2 ? 'high' : criticals>=1 || warnings>=2 ? 'medium' : 'low';
  const riskLabel = {low:'Low Risk',medium:'Moderate Risk',high:'Elevated Risk'}[riskLevel];
  const riskDesc  = {
    low:'No major behavioural red flags detected. Cashflow pattern appears consistent with stated income.',
    medium:'One or more risk factors identified. Further verification recommended before credit approval.',
    high:'Multiple risk factors detected. Manual review required. Credit decision should not proceed without additional documentation.',
  }[riskLevel];

  return {
    riskLevel, riskLabel, riskDesc, flags,
    consistencyScore, incomeCoverage,
    betting, bettingTotal, bettingPct,
    atm, atmTotal, atmPct,
    loans, loanTotal, loanMonthly,
    salaryIn, salaryPresent, salaryAvg, salaryVariance,
    webPurch, supermarket, pos, intl, savings,
    majorDebits, majorThreshold,
    avgMonthlyIncome, totalCr, totalDr, monthly,
  };
}

// ── Page renderer ─────────────────────────────────────────────────
function renderPage(page) {
  const el = $('mainArea');
  if (!el) return;
  switch(page) {
    case 'case':         el.innerHTML = renderCase(); break;
    case 'analysis':     el.innerHTML = renderAnalysis(); break;
    case 'workbench':    el.innerHTML = renderWorkbench(); break;
    case 'overview':     el.innerHTML = state ? renderOverview()     : renderUpload(); break;
    case 'transactions': el.innerHTML = state ? renderTransactions()  : renderUpload(); break;
    case 'insights':     el.innerHTML = state ? renderInsights()      : renderUpload(); break;
    case 'credit':       el.innerHTML = state ? renderCredit()       : renderUpload(); break;
    default:             el.innerHTML = renderUpload(); break;
  }
  attachPageEvents(page);
}

function attachPageEvents(page) {
  // Case page (CrediTrace multi-statement upload)
  const ctDz = $('ctDrop'), ctFin = $('ctFileIn');
  if (ctDz) {
    ctDz.addEventListener('dragover', e => { e.preventDefault(); ctDz.classList.add('over'); });
    ctDz.addEventListener('dragleave', () => ctDz.classList.remove('over'));
    ctDz.addEventListener('drop', e => {
      e.preventDefault(); ctDz.classList.remove('over');
      ctHandleFiles([...e.dataTransfer.files]);
    });
  }
  if (ctFin) ctFin.addEventListener('change', e => { ctHandleFiles([...e.target.files]); e.target.value = ''; });
  const ctDateIn = $('ctAppDate');
  if (ctDateIn) ctDateIn.addEventListener('change', e => { ct.appDate = e.target.value; });
  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => ctRemoveStatement(btn.dataset.remove));
  });
  document.querySelectorAll('[data-appacct]').forEach(radio => {
    radio.addEventListener('change', () => ctSetAppAccount(radio.dataset.appacct));
  });

  // Workbench page
  document.querySelectorAll('[data-filter-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      ctWb[btn.dataset.filterGroup] = btn.dataset.filterVal;
      renderPage('workbench');
    });
  });
  document.querySelectorAll('[data-expand-id]').forEach(head => {
    head.addEventListener('click', () => {
      const id = head.dataset.expandId;
      ctWb.expandedId = ctWb.expandedId === id ? null : id;
      renderPage('workbench');
    });
  });
  document.querySelectorAll('[data-verdict-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      ctSetVerdict(btn.dataset.verdictId, btn.dataset.verdictVal);
      renderPage('workbench');
    });
  });
  document.querySelectorAll('[data-note-id]').forEach(ta => {
    ta.addEventListener('click', e => e.stopPropagation());
    ta.addEventListener('change', () => ctSetNote(ta.dataset.noteId, ta.value));
  });

  // Upload page
  const dz=$('dropZone'), fin=$('fileIn');
  if (dz) {
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{
      e.preventDefault(); dz.classList.remove('over');
      const f=e.dataTransfer.files[0];
      if(f?.type==='application/pdf') analyse(f);
      else { const eb=$('errBox'); if(eb){eb.textContent='⚠ Please provide a PDF file.';eb.classList.add('vis');} }
    });
  }
  if (fin) fin.addEventListener('change',e=>{ if(e.target.files[0]) analyse(e.target.files[0]); });

  // Overview page
  const dlX=$('dlXLSX'), dlC=$('dlCSV'), dlMemo=$('dlMemoXLSX');
  if (dlX) dlX.addEventListener('click',()=>dlXLSX());
  if (dlMemo) dlMemo.addEventListener('click',()=>dlMemoXLSX());
  if (dlC) dlC.addEventListener('click',()=>dlCSV());

  // Transactions page — view toggle
  const vtI=$('vtInd'), vtM=$('vtMon');
  if (vtI) vtI.addEventListener('click',()=>{ txnView='individual'; renderPage('transactions'); updateNav('transactions'); });
  if (vtM) vtM.addEventListener('click',()=>{ txnView='monthly'; renderPage('transactions'); updateNav('transactions'); });

  // Transactions filter buttons
  document.querySelectorAll('.fbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      txnFilter=btn.dataset.cat;
      const content=$('txnContent');
      if(content && state) {
        const cats=['All',...new Set(state.txns.map(t=>t.cat))].sort();
        content.innerHTML=renderIndividualTxns(state.txns, cats);
        attachPageEvents('transactions');
      }
    });
  });

  // Search
  const srch=$('txnSearchInp');
  if (srch) {
    srch.addEventListener('input',e=>{
      txnSearch=e.target.value;
      const content=$('txnContent');
      if(content && state) {
        const cats=['All',...new Set(state.txns.map(t=>t.cat))].sort();
        content.innerHTML=renderIndividualTxns(state.txns, cats);
        attachPageEvents('transactions');
      }
    });
  }
}

// ── Nav & global events ───────────────────────────────────────────
document.querySelectorAll('.s-nav-item').forEach(item=>{
  item.addEventListener('click',()=>navigate(item.dataset.page));
});

$('sUploadBtn').addEventListener('click',()=>{
  state=null; txnView='individual'; txnFilter='All'; txnSearch='';
  navigate('upload');
});

// ── Theme ─────────────────────────────────────────────────────────
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('bl_theme', t); } catch(_) {}
}
function initTheme() {
  let t = null;
  try { t = localStorage.getItem('bl_theme'); } catch(_) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
}
initTheme();
$('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.classList.add('theme-anim');
  applyTheme(cur);
  setTimeout(() => document.documentElement.classList.remove('theme-anim'), 320);
});

// ── Init ──────────────────────────────────────────────────────────
const initPage = location.hash.slice(1) || 'case';
renderPage(initPage);
updateNav(initPage);
</script>
</body>
</html>
